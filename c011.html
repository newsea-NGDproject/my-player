<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<!-- PWA設定 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007aff">

<!--
    ⚠️ このタイトルは「アプリ名の予備」でもあります(v193で判明)。

    index.html は読み込んだ瞬間に、このページ(c011.html)へ飛びます。
    つまり竹弘が「ホーム画面に追加」を押す時、**ブラウザが見ている
    ページはここ**です。アイコンの登録がうまくいかなかった時、
    Androidはアプリ名をここの <title> から取ります。

    v192まで「NoriRun c011-v01.3-bs01 起動OP」だったため、
    ホーム画面に **NoriRun** と出ていました(竹弘の実機報告)。
    ⚠️ **先頭は必ず「ノリRun」にすること。** 名前は長いと途中で
       切られるので、先頭が違うと切られた時に別名になります。

    ※ 旧「cNNN-vX.Y-bsNN」形式はCLAUDE.mdで廃止済みなので、
      あわせて今の形に直しました。
-->
<title>ノリRun (v197) 起動OP</title>

<style>
/* 全体設定 */
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#ffffff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* 画面中央配置 */
body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* コンテンツ全体 */
.splash{
    text-align:center;
    width:100%;
}

/* ==============================
   アニメーション共通設定
   ============================== */

/*
    最初はすべて透明にしておきます。
    JavaScriptで show クラスが付くと表示されます。
*/
.fade-item{
    opacity:0;

    /* 下から動かさず、透明から見えるようにする */
    transition:opacity 1s ease;
}

/*
    表示状態です。
    opacity:1 で見えるようになります。
*/
.fade-item.show{
    opacity:1;
}

/* ==============================
   メインタイトル部分
   ============================== */

/*
    ノッて・走る・プレイヤーを横並びにします。
*/
/*
==========================================================
 ⚠️ v197で、文字の大きさと太さを作り直しました(竹弘の指示)
==========================================================

竹弘の言葉:「起動タイトルの位置とフォントのバランスが悪いのが
気になって、**アプリの顔になるので**直してから進みたい」。

理想の見本(private/ に保管)のフォント指定は
**HGP平成角ゴシック体W9 / サイズ74**(フォトショップ上)でした。

⚠️ **そのフォントそのものは使えません。** 日本語フォントは1つ数MBあり、
   CDN禁止ルール(圏外でも動くPWAのため)から同梱するしかなく、
   起動画面のためだけに入れるには重すぎます。
   → **端末に元からある角ゴシックを、いちばん太い900で使う**のが
     いちばん近づける手です。W9の「ずんぐり太い」感じが出ます。

【clamp() を使っている理由】

    clamp(最小, ふつう, 最大)

「ふつう」を **vw(画面の横幅の%)** で書くと、画面が広い端末では
大きく、狭い端末では小さく、**自動で収まります**。

この行は white-space:nowrap(折り返さない)なので、決め打ちの大きさに
すると**狭い端末で画面からはみ出します**。理想の見本でも「プレイヤー」が
右にはみ出しかけていたので、ここは特に効きます。
※ 下の .sub-title / .footer が前から使っている書き方に揃えました。
*/
.main-title{
    display:flex;
    justify-content:center;
    align-items:flex-start;

    gap:1.2em;

    /* 1.6rem 決め打ち → 画面幅に追従(竹弘の端末で約1.8rem相当) */
    font-size:clamp(1.4rem,7vw,2.3rem);

    /* 300(細字)→ 700。理想の見本の方がはっきり太い */
    font-weight:700;

    letter-spacing:0.06em;

    white-space:nowrap;
    margin-bottom:80px;
}

/*
    文字と絵文字を縦並びにします。

    例：
    ノッて
     🕺
*/
.title-block{
    display:flex;
    flex-direction:column;
    align-items:center;

    /*
    文字と絵文字の間です。v197で 60px → 46px に詰めました。
    理想の見本では、絵文字が文字にもう少し寄っていたためです。

    ⚠️ align-items:center が「文字と絵文字の縦の芯を揃える」役です。
       竹弘が理想の見本に引いた3本の縦線(🕺/🏃/📱 を貫く線)は
       ここが効いている部分で、**もともと揃っていました。**
    */
    gap:46px;
}

/*
    文字部分です。
*/
.title-word{
    display:block;
}

/*
    絵文字部分です。
    letter-spacing の影響を受けないようにしています。
*/
.emoji{
    /*
    v197で 2rem → 2.5rem(竹弘「絵文字のサイズも変えているから
    近づけて欲しい」)。

    ⚠️ ここは vw ではなく rem のままにしています。絵文字は1文字ぶんの
       幅しか使わないので、上の行のようにはみ出す心配がないためです。
    */
    font-size:2.5rem;
    letter-spacing:0;

    /* Androidでもカラー絵文字を優先して表示するための指定 */
    font-family:
        "Noto Color Emoji",
        "Apple Color Emoji",
        "Segoe UI Emoji",
        sans-serif;
}

/* ==============================
   ロゴ部分
   ============================== */

/*
    ノリRunを中央に配置します。
*/
.logo{
    display:flex;
    justify-content:center;
    align-items:center;

    /*
    v197で 3.2rem 決め打ち → 画面幅に追従(竹弘の端末で約3.4rem相当)。
    上の .main-title と同じ clamp() の考え方です。
    */
    font-size:clamp(2.6rem,13vw,4rem);

    /*
    ⚠️⚠️ **ここが今回いちばん大きい変更です(v197)。**

    v196まで「ノリ」は普通の太さ(400)、「Run」だけ太字(700)でした。
    理想の見本では **「ノリ」も「Run」も同じように極太**で、
    2枚を見比べた時にいちばん目に付く違いがこれでした。

    900 は、その端末が持っている**いちばん太い字**という意味です。
    竹弘の指定した HGP平成角ゴシック体W9 の「W9」も
    **同じく一番太いという意味**なので、狙いは揃っています。
    */
    font-weight:900;

    margin-bottom:80px;
}

/*
    ノリとRunの間隔です。
*/
.logo-nori{
    margin-right:0.08em;
}

/*
    ⚠️ v196まではここで「Runだけ」太字にしていました。
       v197で .logo 側に font-weight:900 を掛けたので、
       ノリもRunも同じ太さになります。
       **Runだけを太くしたい時は、ここに書き戻すこと。**
*/
.logo-run{
    font-weight:900;
}


/* ==============================
   下部テキスト
   ============================== */

/*
    下部テキストは見えない文字が見えてくる感じの表示
*/
.soft-fade{
    transition: opacity 0.5s ease;
}

/* サブタイトル */
.sub-title{
    font-size:clamp(1.6rem,6vw,3rem);
    font-weight:700;
    margin-bottom:15px;
}

/* フッター */
.footer{
    font-size:clamp(1.4rem,5vw,2.5rem);
    font-weight:300;
    letter-spacing:0.05em;
}

.splash{
    transform:translateY(-5%);
}
</style>

</head>
<body>

<div class="splash">

    <!--
        メインタイトル部分です。
        文字と絵文字を1セットにしてあります。

        step1：ノッて + 🕺
        step2：走る + 🏃
        step3：プレイヤー + 📱

        JavaScriptで順番に show クラスを付けて表示します。
    -->
    <div class="main-title">

        <span id="step1" class="fade-item title-block">
            <span class="title-word">ノッて</span>
            <span class="emoji">🕺</span>
        </span>

        <span id="step2" class="fade-item title-block">
            <span class="title-word">走る</span>
            <span class="emoji">🏃‍♂️</span>
        </span>

        <span id="step3" class="fade-item title-block">
            <span class="title-word">プレイヤー</span>
            <span class="emoji">📱</span>
        </span>

    </div>

    <!--
        ロゴ部分です。
        「ノリ」と「Run」を分けることで、
        ノリ → Run の順番で表示できます。
    -->
    <div class="logo">
        <span id="logo-nori" class="fade-item logo-nori">ノリ</span>
        <b id="logo-run" class="fade-item logo-run">Run</b>
    </div>

    <!--
        下部テキストです。
        2行まとめて最後にふわっと表示します。
    -->
    <div id="bottom-text" class="fade-item soft-fade">
        <div class="sub-title">
            Music Player NoriRun
        </div>

        <div class="footer">
            TOKYO JAPAN since 2026
        </div>
    </div>

</div>
<script>
/*
    ページの読み込みが完了してから処理を始めます。
*/
window.addEventListener("load", function () {

    /*
        表示する順番とタイミングを配列で管理します。

        delay はミリ秒です。
        1000 = 1秒
        500  = 0.5秒
    */

    const steps = [
        { id: "step1", delay: 300 },       // 0.3秒後：ノッて + 🕺
        { id: "step2", delay: 1000 },      // 1.0秒後：走る + 🏃
        { id: "step3", delay: 1700 },      // 1.7秒後：プレイヤー + 📱
        { id: "logo-nori", delay: 2400 },  // 2.4秒後：ノリ
        { id: "logo-run", delay: 2700 },   // 2.7秒後：Run
        { id: "bottom-text", delay: 3400 } // 3.4秒後：下部2行
    ];

    /*
        steps の内容を順番に処理します。
        指定した時間が来たら、その要素に show クラスを追加します。
    */
    steps.forEach(function (step) {
        setTimeout(function () {
            const element = document.getElementById(step.id);

            if (element) {
                element.classList.add("show");
            }
        }, step.delay);
    });
/*
    起動オープニングが終わった後、
    テスト用DBクリア画面へ移動します。
*/
setTimeout(function () {

    location.href = "dbclr.html";

}, 5000);

/*
    将来、本番で初期設定へ直接進めたい場合、
　　起動オープニングが終わった後、
    c012へ移動する為の差し替えコードです。
　　dbclr.htmlをc012.htmlに修正します。
setTimeout(function () {

    location.href = "c012.html";

}, 5000);
*/

});
</script>
</body>
</html>
