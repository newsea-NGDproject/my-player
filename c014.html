<!--
======================================================================
 c014(メインメニュー・曲一覧・再生・並び替え)

 NoriRun Phase2

 【画面名】
 メインメニュー

----------------------------------------------------------------------

【この画面の役割】

① c013までに登録したmusic_libraryの曲を一覧表示する

② 曲をタップして再生する

③ 曲順をドラッグ&ドロップで並び替え、playlistsへ保存する

----------------------------------------------------------------------

【このSTEPで実装する内容】

STEP01
    曲一覧表示(music_libraryから取得)

STEP02
    再生ボタンで曲を再生する

STEP03
    並び替え(OFS: On-Demand Floating Sort)を移植し、
    playlistsへ並び順を保存する

----------------------------------------------------------------------

【使用するIndexedDB】

music_library(読み取りのみ)
playlists(読み書き、main_menu_defaultキー)

----------------------------------------------------------------------

【今回は範囲外の機能】

・タップ補正(ノリノリ設定)は別モジュールのため、今回は再生ボタンに置き換える
・ビートマッチング(設定BPMに合わせた再生・接続)は未実装。
  今回は曲を普通の速さで再生するだけ

----------------------------------------------------------------------

【並び替えエンジンについて】

legacy/ver8.5-gemini の「OFS(On-Demand Floating Sort)」モジュールを
移植したもの。ただし、OFSは元々 music_library の file_path をキーに
していたが、現行スキーマ(docs/db-schema.md)は track_id が主キーのため、
track_id 基準に置き換えている。playlistsストアの保存フィールドも
file_path_list ではなく track_id_list(現行スキーマ通り)を使用する。

----------------------------------------------------------------------

【更新履歴】

2026-08-03
    新規作成。曲一覧表示・再生・OFS移植による並び替えを実装(v66)

    (v67)
    再生失敗時のエラーメッセージを、権限切れとコーデック非対応(play()の
    失敗、およびaudio要素のonerror)で区別できるよう修正。
    デバッグログパネルがError/DOMExceptionの中身({}に見えてしまう問題)
    を正しく表示できるよう修正

2026-08-08
    (v68)
    メインメニューを「スマホ1画面に固定、ページ全体はスクロールしない」
    レイアウトへ変更。

    ・画面を縦2分割し、上半分を操作エリア(今後ボタンを追加していく場所)、
      下半分を曲一覧エリアとした
    ・曲一覧は下半分のエリア内だけでスクロールする形に変更
    ・OFSの自動スクロールを、ページ全体(window.scrollBy)から
      曲一覧エリア内(menuListEl.scrollTop)へ付け替え
    ・自動スクロール中に光る帯を、画面の上下端から
      曲一覧エリアの上下端へ移動
    ・開発用デバッグログパネルを開閉式にした(画面下30%を占領したままだと
      固定1画面レイアウトの確認ができないため。起動時は最小化)

    ※ ページ全体が伸びると、上に置いた操作ボタンが曲一覧に押し出されて
      見えなくなる・押せなくなるため(竹弘の要望、2026-08-08)。
      上下の比率(現在は50:50)は仮の値で、今後調整する前提。

    (v69)【STEP A】曲情報(メタデータ)の表示機能を追加。

    ・外部ライブラリ jsmediatags(BSD 3-Clause)を lib/ に同梱して導入
    ・音楽ファイルのタグから タイトル / アーティスト名 を取得
    ・曲の長さは audio要素で実測(タグのTLENは信頼できないため、
      一般的な音楽プレイヤーと同じ方式。竹弘の指示による)
    ・曲一覧の1行を2行構成に変更
        1行目 : タイトル
        2行目 : 曲の長さ(**.** / 1時間超は *.**.**)+ 空白 + アーティスト名
    ・music_library に is_meta_analyzed / is_cover_analyzed を追加
      (docs/db-schema.md を v2.2 に更新済み)
    ・解析状況ランプ(#ofs-lamp)を legacy の OFS Ver1.1 から移植。
      ただし legacy版は固定ウェイトの「演出シミュレーター」で実処理が
      無かったため、実際の解析の進捗に連動する作りに変更した
    ・1曲解析するたびに「その行だけ」差し替える方式にした
      (legacy版はリスト全体を作り直しておりO(n²)で重くなる作りだった)

    取得できなかった時の扱い(竹弘の指示):
        タイトル      → ファイル名を表示
        アーティスト  → 何も表示しない
        曲の長さ      → 何も表示しない

    ※ ジャケット画像の取得・表示は STEP B で実装予定。
      ランプのフェーズ2(緑・ジャケ写同期)もその時に有効化する。

    (v70)【STEP A の不具合修正】アーティスト名が表示されない問題への対処。

    症状: v69の実機テストで、曲の長さは表示されたがアーティスト名が
          空欄のままだった(タグが取得できていない時の動きになっていた)。

    ライブラリ(jsmediatags)のソースを調査した結果、setTagsToRead に
    "title"/"artist" を渡しても内部で正しい項目名へ展開される作りに
    なっており、ライブラリ側に問題は見つからなかった。
    そのため原因を推測で決めつけず、次の2つを同時に入れている。

    ① 確実に値を拾えるようにする修正
       ・setTagsToRead() の絞り込みを外し、全タグを読むようにした
       ・pickTagValue() を追加し、値が
           「文字列」「{data:文字列}のオブジェクト」「生の項目名だけ」
         のどの形で入っていても取り出せるようにした
       ・MP3(ID3v2.3/2.4のTIT2・TPE1)、古いMP3(ID3v2.2のTT2・TP1)、
         M4A(©nam・©ART・aART)の項目名に対応

    ② 万一これでも直らない場合に原因を特定するための診断ログ
       最初の3曲だけ、タグ形式・取得できたキーの一覧・値の型を
       デバッグログパネルに出力する(原因特定後に削除する)

    (v71)【原因判明・修正】アーティスト名が出なかった真の原因は、
    タグの読み取り方ではなく「ライブラリが読み込まれていなかった」こと。

    v70の実機ログに
        ReferenceError: jsmediatags is not defined
    が全曲分出ていた。lib/jsmediatags.min.js をGitに登録し忘れたため、
    GitHub Pages上にファイルが存在しなかった(のりの登録漏れ)。

    さらに、これが二次被害を生んでいた。sw.js の cache.addAll() は
    リスト内の1ファイルでも取得に失敗すると全体が失敗する仕様のため、
    Service Workerの更新自体が失敗し、「CACHE_NAMEを繰り上げたのに
    古いコードが動き続ける」状態になっていた
    (竹弘の「DBクリアしないとランプが出ない」症状の原因)。

    対処:
    ・lib/ をGitに登録(本質的な修正)
    ・sw.js を1ファイルずつキャッシュする方式に変更し、1つ失敗しても
      Service Workerが壊れないようにした
    ・起動時にライブラリの読み込みを確認し、無ければ解析を中止して
      画面のランプに赤字「ライブラリ未読込」を表示するようにした
      (同じ事故が起きた時に一目で分かるようにするため)

    ※ 緑ランプ(フェーズ2)が出ずに黄→青になるのは現時点では仕様。
      ジャケット画像を実装するSTEP Bで有効化する。

======================================================================
-->
<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

    <!-- PWA設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">

    <!-- ブラウザタイトル -->
    <title>

        (v71)ノリRun
        メインメニュー

    </title>

    <style>

        /* ======================================================
           NoriRun 共通デザイン(c013と同じ配色・カード style)
        ====================================================== */

        :root{
            --main-blue:#007aff;
            --bg-color:#f2f2f7;
            --card-bg:#ffffff;
            --text-main:#1c1c1e;
            --text-sub:#8e8e93;
            --border-color:#d1d1d6;
        }

        html,
        body{
            margin:0;
            padding:0;
            width:100%;

            /*
            【固定1画面レイアウトの土台 その1】

            以前は min-height:100%(中身が増えたら下に伸びる)でしたが、
            この画面は「スマホの1画面に必ず収まり、ページ全体は
            絶対にスクロールしない」方針に変更しました。

            そのため、高さを画面ぴったりに固定(height:100%)し、
            はみ出した分は表示しない(overflow:hidden)ようにします。

            こうしておかないと、曲一覧が増えたときにページ全体が
            伸びてしまい、上に置いた操作ボタンが画面外へ
            追い出されて押せなくなります。
            */
            height:100%;
            overflow:hidden;

            /*
            overscroll-behavior:none は、
            「一番下まで来た状態でさらに指を下に引っ張った時、
              ページ全体がゴムのように動く(バウンスする)動き」
            を止める指定です。

            走りながら操作するアプリなので、
            画面がぐらつかないように固定します。
            */
            overscroll-behavior:none;

            background:var(--bg-color);
            color:var(--text-main);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                sans-serif;

            /*
            並び替え操作中に文字が選択されてしまうと
            誤動作の原因になるため、選択を禁止します。
            */
            -webkit-user-select:none;
            user-select:none;
        }

        /*
        【固定1画面レイアウトの土台 その2】

        #app を「画面の高さそのもの」にして、
        中身を縦2段(上半分=操作エリア / 下半分=曲一覧)に分けます。

        ・display:flex + flex-direction:column
            → 子要素を縦に積み上げる並べ方です。
              この指定があると、子要素側で「残りの高さを全部使う」
              といった高さの配分ができるようになります。

        ・height:100dvh の "dvh" とは
            → dynamic viewport height(動的な画面の高さ)の略。
              スマホのブラウザは、スクロールするとアドレスバーが
              引っ込んで表示領域が変わります。
              昔からある 100vh はアドレスバーが出ている状態を
              考慮しないため、画面下がわずかに隠れてしまいます。
              100dvh は「今まさに見えている高さ」に追従します。

              ただし古いブラウザは dvh を知らないので、
              先に 100vh を書いておき、
              dvh を理解できるブラウザだけが後の行で上書きします
              (CSSは同じ指定が2つ並ぶと、後の行が勝つルール)。
        */
        #app{
            max-width:480px;
            margin:0 auto;
            padding:10px;
            box-sizing:border-box;

            height:100vh;
            height:100dvh;

            display:flex;
            flex-direction:column;
            gap:8px;
        }

        .card{
            background:var(--card-bg);
            border-radius:18px;
            padding:20px;
            box-shadow:0 6px 16px rgba(0,0,0,0.08);
        }

        /* ======================================================
           上半分：操作エリア(今後ボタンを追加していく場所)
        ====================================================== */
        /*
        flex:1 1 50% は3つの値をまとめた書き方で、意味は
            flex-grow:1    … 余白があれば伸びる
            flex-shrink:1  … 足りなければ縮む
            flex-basis:50% … 基本の高さは親(=画面)の50%
        です。

        上半分と下半分に同じ指定をすることで、
        画面をきっちり半分ずつに分け合います。

        min-height:0 は、flexboxの有名な落とし穴への対策です。
        flexの子要素は初期状態だと「中身より小さくならない」ため、
        曲が増えると勝手に高さが膨らんで画面からはみ出します。
        min-height:0 を書くと、この制限が外れて
        「指定した50%を守り、中身は内側でスクロールする」
        という本来やりたい動きになります。
        */
        #upper-area{
            flex:1 1 50%;
            min-height:0;

            display:flex;
            flex-direction:column;
            gap:8px;
            overflow:hidden;
        }

        /*
        タイトル部分。中身が固定なので縮ませません(flex-shrink:0)。

        position:relative を付けているのは、この中の右上に
        解析状況ランプ(#ofs-lamp)を絶対配置するための基準にするためです。
        */
        .header-card{
            flex-shrink:0;
            padding:10px 16px;
            position:relative;
        }

        /* ======================================================
           解析状況ランプ(OFS Ver1.1より移植)

           曲データの解析が裏で進んでいることを、画面右上の
           小さなランプで知らせます。3段階で色と文言が変わり、
           全部終わると5秒後にフワッと消えます。
        ====================================================== */

        #ofs-lamp{
            position:absolute;
            top:8px;
            right:8px;

            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:6px;

            /*
            元のOFSは width:145px の固定幅でしたが、
            解析の進捗(3/50 など)も出すようにしたため、
            最低幅だけ確保して横に伸びられるようにしています。
            右上を基準に配置しているので、幅が伸びても
            ランプのアイコン位置は右端で動きません。
            */
            min-width:145px;
            width:auto;

            padding:4px 8px;
            border-radius:6px;
            font-size:0.72rem;
            font-weight:bold;
            box-sizing:border-box;

            /* フェーズ3完了時に、フワッと消えるためのアニメ設定 */
            transition:opacity 0.5s ease;

            /* ランプの下にある文字をタップできるよう、当たり判定を無効化 */
            pointer-events:none;
            z-index:10;
        }

        /* フェーズ1用:速い点滅(0.25秒サイクル) */
        @keyframes blink-fast{
            0%,100%{opacity:1;}
            50%{opacity:0.1;}
        }
        .blink-fast{
            animation:blink-fast 0.25s infinite;
        }

        /* フェーズ2用:普通のテンポの点滅(0.8秒サイクル) */
        @keyframes blink-normal{
            0%,100%{opacity:1;}
            50%{opacity:0.2;}
        }
        .blink-normal{
            animation:blink-normal 0.8s infinite;
        }

        h1{
            margin:0 0 2px;
            text-align:center;
            font-size:1.3rem;
        }

        .sub-title{
            margin:0;
            text-align:center;
            color:var(--text-sub);
            font-size:0.85rem;
        }

        /*
        今後ボタンを置く予定の空きエリア。
        上半分の「余り」を全部受け持ちます(flex:1)。
        再生エリアが表示された時は、その分だけここが縮みます。
        */
        #future-area{
            flex:1;
            min-height:0;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
        }

        .future-note{
            margin:0;
            text-align:center;
            color:var(--text-sub);
            font-size:0.8rem;
            line-height:1.7;
        }

        /* ======================================================
           下半分：曲一覧エリア
        ====================================================== */

        #list-area{
            flex:1 1 50%;
            min-height:0;

            display:flex;
            flex-direction:column;
            padding:12px 12px 10px;
            overflow:hidden;
        }

        .section-title{
            margin:0 0 8px;
            font-size:1.05rem;
            flex-shrink:0;
        }

        /*
        リストの「窓枠」です。
        自分自身はスクロールせず、位置の基準になるだけの箱です。

        position:relative を指定しておくと、
        この中に置いた position:absolute の要素(上下の光る演出)が
        「画面全体」ではなく「この窓枠」を基準に配置されます。
        こうすることで、光る演出が曲一覧エリアの中に収まります。
        */
        #list-viewport{
            position:relative;
            flex:1;
            min-height:0;
        }

        /* ======================================================
           曲一覧(OFS: On-Demand Floating Sort より移植)
        ====================================================== */

        /*
        実際に曲の行が並び、指でスクロールする本体です。

        overflow-y:auto
            → 中身が窓枠より多い時だけ、この要素の中で縦スクロールします。
              ページ全体ではなく「ここだけ」が動くのがポイントです。

        overscroll-behavior:contain
            → リストの端まで来た後もさらにスクロールしようとした時、
              その動きを親(ページ全体)に伝えない指定です。
              「スクロールの連鎖」を断ち切り、画面がずれるのを防ぎます。

        -webkit-overflow-scrolling:touch
            → 指を離した後もスーッと滑る、慣性スクロールを有効にします。
        */
        .music-list{
            height:100%;
            overflow-y:auto;
            overscroll-behavior:contain;
            -webkit-overflow-scrolling:touch;

            display:flex;
            flex-direction:column;
            gap:8px;
            position:relative;

            /* 行の影がスクロールバーで切れないよう、右に少し余白を取ります */
            padding-right:2px;
        }

        /* 通常時：縦スワイプ(スクロール)を100%許可します */
        .music-row{
            display:flex;
            align-items:center;
            background:#f8f8f8;
            border-radius:12px;
            padding:6px;
            box-sizing:border-box;
            border:1px solid var(--border-color);
            height:56px;
            touch-action:pan-y;
            transition:background-color 0.15s ease;

            /*
            flex-shrink:0 は「縮まない」という宣言です。

            曲一覧が高さ固定のエリア内スクロールになったため、
            この指定が無いと、曲数が多い時に flexbox が
            1行1行を潰して無理やり詰め込もうとし、
            行がぺしゃんこになってしまいます。
            */
            flex-shrink:0;
        }

        .square-btn{
            display:flex;
            align-items:center;
            justify-content:center;
            background:#ffffff;
            border:1px solid var(--border-color);
            border-radius:10px;
            cursor:pointer;
            box-sizing:border-box;
            flex-shrink:0;
            width:44px;
            height:44px;
            font-size:1.2rem;
        }

        .play-btn:active{
            background:#e5e5ea;
        }

        /* 右端の並び替えボタンだけ、スクロール操作を完全ブロックします */
        .sort-handle{
            color:#b1b1b6;
            background:#ffffff;
            cursor:grab;
            touch-action:none;
        }

        .sort-handle.active-blue{
            color:#00a2ff !important;
            border-color:#00a2ff !important;
            background:#e6f6ff;
        }

        /* 空中浮遊モード(ドラッグ中の行) */
        .music-row.dragging{
            position:fixed;
            box-shadow:0 15px 35px rgba(0,162,255,0.35);
            background:#ffffff;
            border-color:#00a2ff;
            z-index:10000;
            opacity:0.95;
            transform:scale(1.02);
            pointer-events:none;
            transition:none !important;
        }

        /* 差し込みスロット(指を離した時の着地位置) */
        .drag-placeholder{
            height:56px;
            background:rgba(0,162,255,0.03);
            border:2px dashed #00a2ff;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,162,255,0.2);
            box-sizing:border-box;
            transition:transform 0.2s ease;

            /* 曲の行と同じ理由で、こちらも潰れないようにします */
            flex-shrink:0;
        }

        /* ======================================================
           曲情報エリア(2行構成)

           竹弘の指示による1行の割り当て:

             [ノリ注ボタン:1] [ 曲情報エリア:残り全部 ] [並び替え:1]
                                    ↑
                          1行目 … タイトル
                          2行目 … 曲の長さ + 空白 + アーティスト名
                          右端  … ジャケット画像(取得できた時だけ)
        ====================================================== */

        /*
        以前は .title-area(flex:3)と .artist-area(flex:2)で
        横に2分割していましたが、曲の長さとジャケット画像が加わったため、
        「1つのエリアの中を2行に分ける」構成へ変更しました。
        */
        .info-area{
            flex:1;
            min-width:0;
            display:flex;
            align-items:center;
            padding:0 8px;
            overflow:hidden;
            gap:6px;
        }

        /*
        テキスト2行を縦に積むブロックです。
        min-width:0 は、長い曲名が入った時に
        このブロックが横に膨らんでジャケット画像を
        押し出してしまうのを防ぐための指定です
        (flexアイテムは既定で「中身より狭くならない」ため)。
        */
        .text-block{
            flex:1;
            min-width:0;
            overflow:hidden;
        }

        /* 1行目・2行目。どちらも1行に収め、はみ出しは隠します */
        .info-line{
            overflow:hidden;

        .scroll-text{

        /*
        曲の長さの表示部分。

        font-variant-numeric:tabular-nums は、数字の文字幅を
        すべて同じに揃える指定です(表計算ソフトの数字と同じ考え方)。
        これが無いと「1」と「8」で幅が変わり、曲ごとに

        .duration-text{

        /*
        ジャケット画像。竹弘の指示通り「割合1」=ボタンと同じ44px角で、
        並び替えボタンの左隣(=曲情報エリアの右端)に配置します。

        margin-left:auto は「左側の余白を可能な限り広げる」という意味で、

            80%{transform:translateX(var(--scroll-x));opacity:0;}
            81%{transform:translateX(30px);opacity:0;}

        .scroll-active{

        }

        /*
        曲一覧エリアの上下端が光って、
        自動スクロール中であることを知らせます。

        以前は position:fixed(画面全体の上下端)でしたが、
        曲一覧が画面下半分のエリア内スクロールに変わったため、
        position:absolute にして #list-viewport(窓枠)の
        上下端で光るように変更しました。

        z-index も 10000 から 5 に下げています。
        ドラッグ中の浮遊行(z-index:10000)より下に置くことで、

        .glow-indicator{

        1行に収めて、はみ出した分は「…」で省略する形に変更しました。

        white-space:nowrap  … 改行しない
        overflow:hidden     … はみ出した分は表示しない
        text-overflow:ellipsis … 隠れた部分を「…」で示す

        */
        #now-playing{

            font-size:0.85rem;

            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        audio{
            width:100%;
            height:40px;
        }

    </style>

</head>

<script>
(function(){
    const logBody = document.getElementById("debug-log-body");

    function formatArgs(args){
        return Array.prototype.map.call(args,function(value){
            if(value instanceof Error){
                // ErrorはJSON.stringifyだと空({})に見えるため、
                // name(種類)とmessage(内容)を直接表示します。
                return value.name + ": " + value.message;
            }
            if(typeof value === "object" && value !== null){
                try{ return JSON.stringify(value); }
                catch(e){ return String(value); }
            }
            return String(value);
        }).join(" ");
    }

    function appendLine(text,isError){
        const line = document.createElement("div");
        if(isError){ line.style.color = "#ff453a"; }
        line.textContent = text;
        logBody.appendChild(line);
        logBody.scrollTop = logBody.scrollHeight;
    }

    const originalConsoleLog = console.log;
    console.log = function(){
        originalConsoleLog.apply(console,arguments);
        appendLine(formatArgs(arguments),false);
    };

    const originalConsoleError = console.error;
    console.error = function(){
        originalConsoleError.apply(console,arguments);
        appendLine("[ERROR] " + formatArgs(arguments),true);
    };

    document.getElementById("debug-log-clear").onclick = function(){
        logBody.innerHTML = "";
    };

    // ---- パネルの開閉(最小化)処理 ----
    const panel     = document.getElementById("debug-log-panel");
    const toggleBtn = document.getElementById("debug-log-toggle");
    const titleEl   = document.getElementById("debug-log-title");

    function setMinimized(minimized){
        if(minimized){
            panel.classList.add("minimized");
            toggleBtn.textContent = "▲";
            titleEl.textContent   = "🐛";
        }
        else{
            panel.classList.remove("minimized");
            toggleBtn.textContent = "▼";
            titleEl.textContent   = "開発用デバッグログ";
        }
    }

    toggleBtn.onclick = function(){
        setMinimized(!panel.classList.contains("minimized"));
    };

    // 起動時は最小化。ログを見たい時だけ右下の🐛をタップして開きます。
    setMinimized(true);
})();
</script>

<!--
================================================================
 外部ライブラリ jsmediatags の読み込み

 音楽ファイルの中に埋め込まれているメタデータ(タグ情報)を
 読み取るためのライブラリです。

 ・タイトル、アーティスト名、ジャケット画像を取り出せる
 ・MP3(ID3v1/v2)、M4A/MP4、FLAC、OGG に対応している
 ・日本語タグで使われるUTF-16などの文字コードも自動判別してくれる

 ライセンスは BSD 3-Clause(商用販売可)。
 CDNから読み込まず lib/ に同梱しているのは、ランニング中=電波が
 悪い場所で使うアプリのため。詳細は docs/licenses.md を参照。

 このscriptタグを書くと、JSから window.jsmediatags として使えます。
================================================================
-->
<script src="lib/jsmediatags.min.js"></script>

<script>

/* ==========================================================
   JavaScript

   c013と同じく
   「画面」「DB」「フォルダ」「曲情報」
   の順番でプログラムを並べます。
========================================================== */

// ==========================================================
// 0. 定数定義
// ==========================================================

const DB_NAME = "NoriRunDB";
const DB_VERSION = 1;

const STORE_SETTINGS = "settings";
const STORE_MUSIC = "music_library";
const STORE_PLAYLISTS = "playlists";
const STORE_FOLDER_ROOTS = "folder_roots";

// メインメニューの並び順を保存する、playlistsストアの固定キーです。
const MAIN_MENU_PLAYLIST_ID = "main_menu_default";

// 画面部品を取得しておきます。
const menuListEl = document.getElementById("menu-list");
const audioPlayer = document.getElementById("audio-player");
const playerBox = document.getElementById("player-box");
const nowPlayingEl = document.getElementById("now-playing");

// 再生中の一時URL(曲を切り替える時に解放するため覚えておきます)
let currentObjectUrl = null;

// 現在の曲順(track_idの配列)
let currentOrderList = [];

// track_id をキーにした曲データの早見表
let libraryMap = {};

// ドラッグ&ドロップ操作用の状態(OFSより移植)
let draggingRow = null;
let placeholder = null;
let startOffsetY = 0;
let currentClientY = 0;
let autoScrollActive = false;

/*
自動スクロールが始まる「エリアの端からの距離(px)」です。

元のOFSは画面全体をスクロール対象にしていたので100pxでしたが、
曲一覧が画面下半分(=だいたい高さ300〜400px)のエリア内スクロールに
変わったため、100pxのままだとエリアのほぼ全域が
「自動スクロールゾーン」になってしまいます。

行の高さ(56px)とのバランスを見て、少し狭めています。
*/
const AUTO_SCROLL_ZONE = 55;

// 自動スクロールの最高速度(1フレームあたり何px動かすか)
const AUTO_SCROLL_MAX_SPEED = 18;


// ==========================================================
// 1. IndexedDBを開く・共通関数(c013と同じ内容)
// ==========================================================

function openNoriRunDB(){

    return new Promise(function(resolve,reject){

        const request = indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded = function(event){
            console.log("NoriRunDB 新規作成");
        };

        request.onsuccess = function(event){
            resolve(event.target.result);
        };

        request.onerror = function(){
            reject("NoriRunDBを開けませんでした。");
        };

    });

}

function idbGet(storeName,key){

    return new Promise(async function(resolve,reject){

        try{
            const db = await openNoriRunDB();
            const tx = db.transaction(storeName,"readonly");
            const store = tx.objectStore(storeName);
            const request = store.get(key);

            request.onsuccess = function(){
                db.close();
                resolve(request.result);
            };

            request.onerror = function(){
                db.close();
                reject("データ取得失敗");
            };

        }
        catch(error){
            reject(error);
        }

    });

}

function idbPut(storeName,value,key){

    return new Promise(async function(resolve,reject){

        try{
            const db = await openNoriRunDB();
            const tx = db.transaction(storeName,"readwrite");
            const store = tx.objectStore(storeName);

            if(key === undefined){
                store.put(value);
            }
            else{
                store.put(value,key);
            }

            tx.oncomplete = function(){
                db.close();
                resolve();
            };

            tx.onerror = function(){
                db.close();
                reject("保存失敗");
            };

        }
        catch(error){
            reject(error);
        }

    });

}

function idbGetAll(storeName){

    return new Promise(async function(resolve,reject){

        try{
            const db = await openNoriRunDB();
            const tx = db.transaction(storeName,"readonly");
            const store = tx.objectStore(storeName);
            const request = store.getAll();

            request.onsuccess = function(){
                db.close();
                resolve(request.result || []);
            };

            request.onerror = function(){
                db.close();
                reject("全件取得失敗");
            };

        }
        catch(error){
            reject(error);
        }

    });

}


// ==========================================================
// 2. 曲一覧の読み込み
// ==========================================================
/**
 * music_libraryの全曲と、playlistsに保存済みの並び順を読み込みます。
 *
 * 並び順がまだ保存されていない場合は、
 * music_libraryから取得した順番をそのまま使います。
 *
 * 並び順は保存されているが、その後に新しく登録された曲がある場合は、
 * 保存されていた並び順の「後ろ」に追加します。
 *
 * 逆に、並び順には載っているが、
 * すでにmusic_libraryから消えた曲(track_id)があれば、
 * 一覧から除外します。
 */
async function loadMenuData(){

    const allTracks = await idbGetAll(STORE_MUSIC);

    libraryMap = {};
    allTracks.forEach(function(track){
        libraryMap[track.track_id] = track;
    });

    const playlistData = await idbGet(STORE_PLAYLISTS,MAIN_MENU_PLAYLIST_ID);

    if(playlistData && playlistData.track_id_list && playlistData.track_id_list.length > 0){

        // 保存済みの並び順のうち、今も存在する曲だけを残します。
        currentOrderList = playlistData.track_id_list.filter(function(trackId){
            return libraryMap[trackId] !== undefined;
        });

        // 並び順にまだ載っていない、新しく登録された曲を後ろに追加します。
        allTracks.forEach(function(track){
            if(currentOrderList.indexOf(track.track_id) === -1){
                currentOrderList.push(track.track_id);
            }
        });

    }
    else{

        // 並び順が未保存の場合は、登録されている順番をそのまま使います。
        currentOrderList = allTracks.map(function(track){
            return track.track_id;
        });

    }

    console.log("曲一覧読み込み件数 :",currentOrderList.length);

    renderList();

    /*
    曲一覧を先に表示してから、裏でメタデータの解析を進めます。

    ここで await を付けずに呼んでいるのが重要な点です。
    await を付けると解析が全部終わるまで次の処理に進めませんが、
    付けないことで「一覧はすぐ操作できる状態にしたまま、
    裏で解析だけが進んでいく」形になります。
    竹弘の「曲再生機能を妨げない最速起動」の方針そのものです。

    ただし await を付けない場合、途中でエラーが起きても誰も
    受け止めないまま消えてしまうため、.catch() で拾って
    ログに残すようにしています。
    */
    startMetadataEngine().catch(function(error){
        console.error("メタデータ解析エンジンで予想外のエラー :",error);
    });

}


// ==========================================================
// 3. 曲一覧の描画(OFSより移植、track_id基準に変更)
// ==========================================================

function renderList(){

    menuListEl.innerHTML = "";

    if(currentOrderList.length === 0){
        menuListEl.innerHTML =
            "<div class='empty-message'>まだ曲が登録されていません。<br>" +
            "c013の「Musicフォルダ確認」から曲を登録してください。</div>";
        return;
    }

    currentOrderList.forEach(function(trackId){

        const row = createRowElement(trackId);
        if(row){ menuListEl.appendChild(row); }

    });

}

/*
1曲分の行(.music-row)を作って返します。

renderList()から切り出して独立した関数にしたのは、
メタデータの解析が終わった曲を「その行だけ」差し替えたいためです。

【なぜ「その行だけ」にこだわるのか】
OFS Ver1.1(legacy)では、1曲解析するたびにリスト全体を作り直して
いました。100曲だと延べ5,050回も行を作ることになり、曲数が増えるほど
二次関数的に重くなります(いわゆるO(n²)問題)。
1曲=1行だけ差し替えれば、何百曲になっても速度が落ちません。
*/
function createRowElement(trackId){

    const track = libraryMap[trackId];
    if(!track){ return null; }

    const row = document.createElement("div");
    row.className = "music-row";
    row.dataset.trackId = trackId;

    row.innerHTML =
        "<button class='square-btn play-btn'>▶️</button>" +
        "<div class='info-area'>" +
            "<div class='text-block'>" +
                "<div class='info-line line-title'>" +
                    "<span class='scroll-text'>" + escapeHtml(buildTitleText(track)) + "</span>" +
                "</div>" +
                "<div class='info-line line-meta'>" +
                    "<span class='artist-text'>" + buildMetaHtml(track) + "</span>" +
                "</div>" +
            "</div>" +
        "</div>" +
        "<button class='square-btn sort-handle'>" +
            "<svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'>" +
                "<line x1='12' y1='2' x2='12' y2='22'></line>" +
                "<polyline points='7 7 12 2 17 7'></polyline>" +
                "<polyline points='7 17 12 22 17 17'></polyline>" +
            "</svg>" +
        "</button>";

    const playBtn = row.querySelector(".play-btn");
    playBtn.addEventListener("click",function(){
        playTrack(trackId);
    });

    // 1行目・2行目それぞれ、タップすると横スクロールで全文を見せます。
    const lineTitle = row.querySelector(".line-title");
    const lineMeta = row.querySelector(".line-meta");
    lineTitle.addEventListener("click",function(){ triggerMarquee(lineTitle); });
    lineMeta.addEventListener("click",function(){ triggerMarquee(lineMeta); });

    const sortHandle = row.querySelector(".sort-handle");
    bindDragAndDropEvents(row,sortHandle);

    return row;

}

/*
1行目に出す文字を決めます。

竹弘の指示:
    「タイトルが取得できない時は、ファイル名を表示する仕様とします」

c013の登録時点で title には file_name が入っているため、
通常はそのままでも表示できますが、タグ解析で空文字が
入ってしまった場合の保険としても || で受け止めています。
*/
function buildTitleText(track){
    return track.title || track.file_name || "(名称不明)";
}

/*
2行目に出すHTMLを組み立てます。

竹弘の指示:
    「1行目をタイトル、2行目を曲長さ(時分秒対応**.**.**)表示の後ろに
      1ブランク空けてアーティスト名とする」
    「アーティスト名が取得できない時は、何も表示しません」

曲の長さだけ数字の幅を揃えたい(.duration-text)ので、
文字列ではなくHTMLとして組み立てています。
*/
function buildMetaHtml(track){

    const durationText = formatDuration(track.duration);
    const artistText = track.artist || "";

    let html = "";

    if(durationText !== ""){
        html = "<span class='duration-text'>" + durationText + "</span>";
    }

    if(artistText !== ""){
        // 曲の長さとアーティスト名の間に、指示通り空白を1つ入れます。
        // &nbsp; ではなく通常の空白でよいのは、HTMLの空白が詰められるのは
        // 「連続した空白」の場合だけで、1つなら維持されるためです。
        if(html !== ""){ html = html + " "; }
        html = html + escapeHtml(artistText);
    }

    return html;

}

/*
秒数を「時.分.秒」の文字列に変換します。

竹弘の指示により、区切り文字は一般的な「:」ではなく「.」を使います。
1時間未満の曲は「分.秒」の2枠、1時間を超える曲だけ「時.分.秒」の3枠。

    222秒   → "03.42"
    725秒   → "12.05"
    3872秒  → "1.04.32"

まだ解析していない(duration が 0)場合は空文字を返し、
2行目には何も表示しません。解析が済んだ時点で数字が現れます。
*/
function formatDuration(seconds){

    // 数値として扱えない値・0以下・無限大(Infinity)を弾きます。
    // isFiniteは「ちゃんと有限の数値か」を判定する標準関数です。
    if(!seconds || !isFinite(seconds) || seconds <= 0){
        return "";
    }

    const total = Math.round(seconds);

    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const secs = total % 60;

    // padStart(2,"0") は「2桁になるまで先頭に0を足す」という命令です。
    // (例: "5" → "05")
    function pad2(value){
        return String(value).padStart(2,"0");
    }

    if(hours > 0){
        return hours + "." + pad2(minutes) + "." + pad2(secs);
    }

    return pad2(minutes) + "." + pad2(secs);

}

/*
HTMLとして表示する文字に、曲名由来の記号(<や>など)が
含まれていても崩れないようにする、簡易的なエスケープ関数です。
*/
function escapeHtml(text){
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

// 長いタイトル/アーティスト名をタップした時、横スクロールで見せます。
function triggerMarquee(areaElement){

    const textElement = areaElement.firstElementChild;
    textElement.classList.remove("scroll-active");
    void textElement.offsetWidth;

    const areaWidth = areaElement.offsetWidth;
    const textWidth = textElement.scrollWidth;
    const speed = 50;

    let scrollDistance = textWidth > areaWidth ? textWidth - areaWidth + 20 : textWidth * 0.6;
    const duration = (scrollDistance + areaWidth) / speed;

    textElement.style.setProperty("--scroll-x","-" + scrollDistance + "px");
    textElement.style.setProperty("--scroll-duration",duration + "s");
    textElement.classList.add("scroll-active");

    textElement.addEventListener("animationend",function(){
        textElement.classList.remove("scroll-active");
    },{once:true});

}


// ==========================================================
// 4. 曲の再生
// ==========================================================
/**
 * 指定したtrack_idの曲を再生します。
 *
 * track.file_handle は c013のスキャン時にMusicフォルダから
 * 取得したFileSystemFileHandleです。
 *
 * c013の権限バグと同じ理由(ページ遷移でJSの実行コンテキストが
 * リセットされるため)で、ここでも必ず権限を確認し直してから
 * ファイルを読み込みます。
 */
async function playTrack(trackId){

    try{

        const track = libraryMap[trackId];

        if(!track || !track.file_handle){
            alert("曲データが見つかりませんでした。c013で再登録してください。");
            return;
        }

        // --- 権限を確認し直します(c013と同じパターン) ---
        let permission = await track.file_handle.queryPermission({mode:"read"});

        if(permission !== "granted"){
            permission = await track.file_handle.requestPermission({mode:"read"});
        }

        if(permission !== "granted"){
            alert("この曲へのアクセスが許可されませんでした。");
            return;
        }

        const file = await track.file_handle.getFile();

        if(currentObjectUrl){
            URL.revokeObjectURL(currentObjectUrl);
        }

        currentObjectUrl = URL.createObjectURL(file);

        audioPlayer.src = currentObjectUrl;
        nowPlayingEl.textContent = "再生中：" + (track.title || track.file_name);
        playerBox.style.display = "block";

        /*
        ここから下は、権限やファイル取得ではなく
        「実際に音として再生できるか」の問題です。

        権限が原因の失敗と、コーデック非対応など
        別の原因の失敗を混同しないよう、
        try/catchを分けています。
        */
        try{

            await audioPlayer.play();

            console.log("再生開始 :",track.file_name);

        }
        catch(playError){

            console.error(
                "再生失敗(play) :",
                playError.name,
                playError.message
            );

            alert(
                "この曲は再生できませんでした。\n" +
                "ファイル形式(コーデック)がこの端末で対応していない可能性があります。\n" +
                "(" + track.file_name + ")"
            );

        }

    }
    catch(error){
        console.error(
            "再生失敗(権限/ファイル取得) :",
            error.name,
            error.message
        );
        alert("再生に失敗しました。ブラウザのファイル権限が切れている可能性があります。");
    }

}

/*
============================================================
audio要素自体がエラーを起こした時の処理

play()の時点ではエラーにならなくても、
実際にファイルを読み込んで再生しようとした段階で
コーデック非対応と分かることがあります。

その場合はこちらのonerrorイベントで検知します。
============================================================
*/
audioPlayer.onerror = function(){

    if(!audioPlayer.error){ return; }

    console.error(
        "audio要素エラー :",
        audioPlayer.error.code,
        audioPlayer.error.message
    );

    let reason = "不明なエラーです。";

    if(audioPlayer.error.code === audioPlayer.error.MEDIA_ERR_DECODE){
        reason = "ファイル形式(コーデック)がこの端末で対応していない可能性があります。";
    }
    else if(audioPlayer.error.code === audioPlayer.error.MEDIA_ERR_SRC_NOT_SUPPORTED){
        reason = "この形式のファイルは、このブラウザでは再生できません。";
    }

    alert("再生できませんでした。\n" + reason);

};


// ==========================================================
// 5. 並び替え(OFS: On-Demand Floating Sort を移植)
// ==========================================================
/*
以下は legacy/ver8.5-gemini の OFSモジュールを移植したものです。
処理の考え方は元のOFS仕様書の通りで、変えていません。

・並び替えボタン(.sort-handle)を掴んだ時だけ反応する
  (曲名エリアでの通常スクロールを邪魔しないため)
・指を離した時だけ、並び順をplaylistsストアへ保存する
  (ドラッグ中に毎回保存すると重くなるため)
*/

function bindDragAndDropEvents(row,handle){

    handle.addEventListener("pointerdown",function(e){

        e.preventDefault();
        draggingRow = row;
        currentClientY = e.clientY;

        const rect = row.getBoundingClientRect();
        startOffsetY = e.clientY - rect.top;

        if(!placeholder){
            placeholder = document.createElement("div");
            placeholder.className = "drag-placeholder";
        }

        row.parentNode.insertBefore(placeholder,row);

        row.style.width = rect.width + "px";
        row.style.height = rect.height + "px";
        row.style.left = rect.left + "px";
        row.style.top = rect.top + "px";
        row.classList.add("dragging");
        handle.classList.add("active-blue");

        handle.setPointerCapture(e.pointerId);

        if(navigator.vibrate){ navigator.vibrate(15); }

        // 掴んだ瞬間は自動スクロールを起動しません(端をうっかり掴んだ時の暴走防止)。

    });

    handle.addEventListener("pointermove",function(e){

        if(!draggingRow){ return; }
        e.preventDefault();

        currentClientY = e.clientY;

        draggingRow.style.top = (currentClientY - startOffsetY) + "px";

        updatePlaceholderPosition(currentClientY);

        // 指が動くたびにセンサーを起動します(端に入った時だけループが着火します)。
        startAutoScrollLoop();

    });

    handle.addEventListener("pointerup",function(e){

        if(!draggingRow){ return; }
        handle.releasePointerCapture(e.pointerId);
        clearAllDraggingStates();

    });

}

function updatePlaceholderPosition(clientY){

    if(!draggingRow || !placeholder){ return; }

    const siblings = Array.prototype.slice.call(
        menuListEl.querySelectorAll(".music-row:not(.dragging)")
    );

    const nextSibling = siblings.find(function(sibling){
        const box = sibling.getBoundingClientRect();
        return clientY <= box.top + box.height / 2;
    });

    if(nextSibling){
        menuListEl.insertBefore(placeholder,nextSibling);
    }
    else{
        menuListEl.appendChild(placeholder);
    }

}

/*
オンデマンド(指の動きに応じて)再着火する自動スクロールループです。

一度ゾーンから出るとループを終了させ、
次にゾーンへ入った時にまた新しく起動し直します。
(こうしないと「一度止まると二度と動かない」バグになります)

--------------------------------------------------------------
【固定1画面化にあたっての変更点】

元のOFSは、ページ全体がスクロールする前提で作られており、
    ・window.scrollY   (ページ全体が今どこまでスクロールしたか)
    ・window.innerHeight(画面の高さ)
    ・window.scrollBy() (ページ全体を動かす)
を使っていました。

しかし今回、曲一覧は画面下半分のエリア内だけでスクロールする
形に変わったため、判断の基準を全て
「曲一覧エリア(menuListEl)」に置き換えています。

    window.scrollY      → menuListEl.scrollTop
                          (このエリアが今どこまでスクロールしたか)
    window.innerHeight  → エリアの上端/下端の画面座標
    window.scrollBy()   → menuListEl.scrollTop += speed

なお getBoundingClientRect() は
「その要素が今、画面のどこに見えているか」を返す命令です。
エリアの位置は画面の高さによって変わる(再生エリアの表示/非表示や
アドレスバーの伸縮の影響を受ける)ため、決め打ちの数値ではなく
毎回この命令で測り直しています。
--------------------------------------------------------------
*/
function startAutoScrollLoop(){

    if(autoScrollActive){ return; }

    // 曲一覧エリアが、今画面のどの位置にあるかを測ります。
    const listRect = menuListEl.getBoundingClientRect();

    // このエリアが「あと何pxスクロールできるか」の上限値です。
    // (中身全体の高さ - 見えている高さ = 隠れている分)
    const scrollMax = menuListEl.scrollHeight - menuListEl.clientHeight;

    // 指がエリアの上端付近にあり、かつ、まだ上にスクロールできる状態か
    const isTopZone =
        (currentClientY < listRect.top + AUTO_SCROLL_ZONE &&
         menuListEl.scrollTop > 0);

    // 指がエリアの下端付近にあり、かつ、まだ下にスクロールできる状態か
    const isBottomZone =
        (currentClientY > listRect.bottom - AUTO_SCROLL_ZONE &&
         menuListEl.scrollTop < scrollMax);

    if(!isTopZone && !isBottomZone){ return; }

    autoScrollActive = true;

    function scrollLoop(){

        if(!draggingRow){ stopAutoScrollGlow(); return; }

        let speed = 0;

        // ループの毎回、エリアの位置と残りスクロール量を測り直します。
        const rect = menuListEl.getBoundingClientRect();
        const currentScrollMax = menuListEl.scrollHeight - menuListEl.clientHeight;

        const glowTop = document.getElementById("glow-top");
        const glowBottom = document.getElementById("glow-bottom");

        glowTop.classList.remove("glow-active");
        glowBottom.classList.remove("glow-active");

        if(currentClientY < rect.top + AUTO_SCROLL_ZONE &&
           menuListEl.scrollTop > 0){

            /*
            ratio は「ゾーンにどれだけ深く入り込んだか」を
            0〜1で表した割合です。端に近いほど1に近づき、速く動きます。

            Math.min(ratio,1) で1を超えないように制限しているのは、
            指が曲一覧エリアの外(画面の上半分)まで出た時に
            割合が1を超えてスクロールが暴走するのを防ぐためです。
            (エリアが画面の半分になったことで、
              指が外に出るケースが起きやすくなったため追加しました)
            */
            const ratio = (rect.top + AUTO_SCROLL_ZONE - currentClientY) / AUTO_SCROLL_ZONE;
            speed = -Math.ceil(Math.min(ratio,1) * AUTO_SCROLL_MAX_SPEED);
            glowTop.classList.add("glow-active");
        }
        else if(currentClientY > rect.bottom - AUTO_SCROLL_ZONE &&
                menuListEl.scrollTop < currentScrollMax){

            const ratio = (currentClientY - (rect.bottom - AUTO_SCROLL_ZONE)) / AUTO_SCROLL_ZONE;
            speed = Math.ceil(Math.min(ratio,1) * AUTO_SCROLL_MAX_SPEED);
            glowBottom.classList.add("glow-active");
        }

        if(speed !== 0){
            // ページ全体ではなく、曲一覧エリアの中だけを動かします。
            menuListEl.scrollTop += speed;
            updatePlaceholderPosition(currentClientY);
            requestAnimationFrame(scrollLoop);
        }
        else{
            autoScrollActive = false;
            stopAutoScrollGlow();
        }

    }

    requestAnimationFrame(scrollLoop);

}

function stopAutoScrollGlow(){
    document.getElementById("glow-top").classList.remove("glow-active");
    document.getElementById("glow-bottom").classList.remove("glow-active");
}

function clearAllDraggingStates(){

    let needSave = false;

    if(draggingRow && placeholder && placeholder.parentNode){
        placeholder.parentNode.insertBefore(draggingRow,placeholder);
        needSave = true;
    }

    if(placeholder && placeholder.parentNode){
        placeholder.parentNode.removeChild(placeholder);
    }

    menuListEl.querySelectorAll(".music-row").forEach(function(row){
        row.classList.remove("dragging");
        row.style.position = "";
        row.style.width = "";
        row.style.height = "";
        row.style.left = "";
        row.style.top = "";
    });

    menuListEl.querySelectorAll(".sort-handle").forEach(function(h){
        h.classList.remove("active-blue");
    });

    draggingRow = null;
    autoScrollActive = false;
    stopAutoScrollGlow();

    if(needSave){
        saveNewOrderFromDOM();
    }

}

/*
指を離した時、実際のDOMの並び順を読み取って
playlistsストアへ保存します。

現行スキーマ(docs/db-schema.md)に合わせ、
track_id_list という配列名で保存します。
(OFSの元の実装はfile_path_listでしたが、
 track_idを主キーとする現行スキーマに合わせて変更しています)
*/
async function saveNewOrderFromDOM(){

    const rows = Array.prototype.slice.call(
        menuListEl.querySelectorAll(".music-row")
    );

    currentOrderList = rows.map(function(row){
        return row.dataset.trackId;
    });

    const playlistData = {
        playlist_id: MAIN_MENU_PLAYLIST_ID,
        playlist_name: "メイン全曲リスト",
        track_id_list: currentOrderList,
        norirun_track_id_list: []
    };

    await idbPut(STORE_PLAYLISTS,playlistData);

    console.log("並び順を保存しました :",currentOrderList.length,"曲");

}

window.addEventListener("pointerup",clearAllDraggingStates);
window.addEventListener("pointercancel",clearAllDraggingStates);


// ==========================================================
// 6. メタデータ解析エンジン(3フェーズ演出つき)
// ==========================================================
/*
音楽ファイルの中に埋め込まれているメタデータ(タグ情報)を読み取り、
music_libraryへ保存し、画面の表示を更新します。

【legacy(OFS Ver1.1)からの設計変更点】

legacyの3フェーズ演出は「シミュレーター」で、実際のタグ読み取りは
行っておらず、150ms・400msの固定ウェイトで見た目だけを再現していました。
そのままの作りにすると、100曲で15秒+40秒の「ただ待つだけの時間」が
発生し、竹弘の「最速起動」方針と矛盾します。

そこで固定ウェイトは全て外し、ランプを「実際の解析の進捗」に
連動させる作りに変更しました。演出の見え方は変わりませんが、
1曲ずつ表示が書き換わっていくのが本物の処理になります。

【解析済みの曲は二度と解析しない】
is_meta_analyzed フラグで判定します。全曲解析済みなら
ランプすら出さずに終了するため、2回目以降の起動は一瞬です。
*/

// 現在のランプのフェーズ(0:非表示, 1:文字取込, 2:ジャケ写, 3:完了)
let lampPhase = 0;

/*
============================================================
タグ解析ロジックのバージョン番号

【何のための仕組みか】

「解析済みの曲は二度と解析しない」(is_meta_analyzed)という
仕組みには、一つ困った副作用があります。
解析のプログラム自体を改善しても、すでに解析済みの曲は
古い結果のまま残り、新しいロジックが適用されないのです。

実際にv69→v70でこの問題が起きました。v69で「アーティスト名が
空」のまま解析済みと記録された曲は、v70でロジックを直しても
再解析されず、いつまでも空欄のままになってしまいます。

そこで、曲ごとに「どのバージョンのロジックで解析したか」を
記録しておき、この番号を上げると自動的に再解析される
ようにしました。

【使い方】
タグ解析のやり方を改善した時に、この数字を1つ上げる。
それだけで、既存の曲も次回起動時に自動で解析し直される。
(竹弘がDBをクリアしてc013から再スキャンする必要はない)

v70で 2 に上げたので、v69で解析済みの曲も再解析される。
============================================================
*/
const META_ANALYZER_VERSION = 2;

/*
============================================================
外部ライブラリが本当に読み込めているかを確認します。

【なぜこの確認が必要になったか(v71で追加)】

v70の実機テストで、lib/jsmediatags.min.js がサーバー上に
存在せず(Gitへの登録漏れ)、全1107曲で
「jsmediatags is not defined」という例外が出続けた。

その時のログは同じエラーが延々と並ぶだけで、
「ライブラリが無い」という本当の原因にたどり着くまでに
時間がかかった。

そこで、起動時に一度だけ明確に警告を出し、
さらに画面のランプにも赤字で知らせるようにした。
これなら次に同じことが起きても一目で分かる。

typeof で調べているのは、存在しない変数を直接参照すると
それ自体がエラーになるため。typeof は未定義の変数に対しても
安全に "undefined" を返してくれる。
============================================================
*/
function isTagLibraryReady(){
    return (typeof jsmediatags !== "undefined");
}

/**
 * 未解析の曲を順番に解析していきます。
 */
async function startMetadataEngine(){

    // ライブラリが無ければ、解析しても全曲失敗するだけなので中止します。
    if(!isTagLibraryReady()){

        console.error(
            "【重大】jsmediatags が読み込めていません。" +
            "lib/jsmediatags.min.js がサーバー上に存在するか確認してください" +
            "(Gitへの登録漏れ・パス間違いが原因になりやすい)。"
        );

        showLampError("ライブラリ未読込");

        return;

    }

    /*
    解析が必要な曲だけを集めます。対象になるのは次の2種類です。

      ① まだ一度も解析していない曲
      ② 古いバージョンのロジックで解析された曲
         (META_ANALYZER_VERSIONの解説を参照)

    ②の判定で「|| 1」を付けているのは、この仕組みを作る前に
    解析された曲には meta_analyzer_version が入っていないため、
    その場合は「バージョン1で解析された」とみなすためです。
    */
    const targets = currentOrderList.filter(function(trackId){

        const track = libraryMap[trackId];
        if(!track){ return false; }

        if(!track.is_meta_analyzed){ return true; }

        return (track.meta_analyzer_version || 1) < META_ANALYZER_VERSION;

    });

    if(targets.length === 0){
        console.log("メタデータは全曲解析済み(ランプは表示しません)");
        return;
    }

    console.log("メタデータ未解析 :",targets.length,"曲");

    let doneCount = 0;
    setLampPhase(1,doneCount,targets.length);

    /*
    for...of で1曲ずつ順番に処理します。

    あえて同時並行(Promise.all)にしていないのは、
    ・何十曲も同時にファイルを開くと端末のメモリを圧迫する
    ・1曲ずつ順に表示が変わっていく方が、竹弘の狙った演出になる
    という2つの理由からです。
    */
    for(const trackId of targets){

        await analyzeOneTrack(trackId);

        doneCount = doneCount + 1;
        setLampPhase(1,doneCount,targets.length);

    }

    console.log("メタデータ解析完了 :",doneCount,"曲");

    /*
    STEP B(次のバージョン)では、この位置にフェーズ2
    (ジャケット画像の取得・緑ランプ)を挟みます。
    現時点では文字情報の取得だけなので、そのまま完了へ進みます。
    */
    setLampPhase(3);

}

/**
 * 1曲分のメタデータを解析して、DBと画面に反映します。
 */
async function analyzeOneTrack(trackId){

    const track = libraryMap[trackId];

    if(!track || !track.file_handle){
        return;
    }

    try{

        /*
        ファイルを読む前に、必ず権限を確認し直します。
        c013の権限バグ、および再生処理(playTrack)と全く同じ理由です
        (ページ遷移でJSの実行コンテキストがリセットされるため)。
        */
        let permission = await track.file_handle.queryPermission({mode:"read"});

        if(permission !== "granted"){
            permission = await track.file_handle.requestPermission({mode:"read"});
        }

        if(permission !== "granted"){
            console.error("解析中止(権限なし) :",track.file_name);
            return;
        }

        const file = await track.file_handle.getFile();

        // --- ① タグから タイトル と アーティスト名 を取得 ---
        const tags = await readTagsFromFile(file);

        if(tags){

            /*
            タグの値は、ファイルの形式や作られ方によって
            「どのキーに、どんな形で入っているか」がバラバラです。
            そのため pickTagValue() で複数の可能性を順番に試します
            (v70での修正。詳しくはpickTagValueの解説を参照)。
            */
            const tagTitle = pickTagValue(tags,"title",TITLE_FRAME_IDS);
            const tagArtist = pickTagValue(tags,"artist",ARTIST_FRAME_IDS);

            if(tagTitle !== ""){
                track.title = tagTitle;
            }
            if(tagArtist !== ""){
                track.artist = tagArtist;
            }

        }

        // タイトルが取れなければファイル名を使う(竹弘の指示)
        if(!track.title){
            track.title = track.file_name;
        }

        // --- ② 曲の長さを実測 ---
        const measured = await measureDuration(file);

        if(measured > 0){
            track.duration = measured;
        }

        // --- ③ 解析済みの印を付けてDBへ保存 ---
        track.is_meta_analyzed = true;

        // どのバージョンのロジックで解析したかも記録しておきます
        // (次にロジックを改善した時、自動で再解析させるため)
        track.meta_analyzer_version = META_ANALYZER_VERSION;

        await idbPut(STORE_MUSIC,track);

        // --- ④ 画面のその行だけを差し替え ---
        refreshRow(trackId);

    }
    catch(error){

        /*
        1曲の失敗で全体を止めないよう、ここで受け止めて次の曲へ進みます。
        is_meta_analyzed を立てないままにしているので、
        次回の起動時にもう一度挑戦されます
        (一時的な権限エラーなら次は成功するため)。
        */
        console.error(
            "解析失敗 :",
            track.file_name,
            error.name,
            error.message
        );

    }

}

/*
============================================================
タグの値を取り出すための「候補キー」の一覧

音楽ファイルのタグは、形式ごとに項目名(キー)が全く違います。
jsmediatagsは "title" / "artist" という分かりやすい名前
(ショートカット)も用意してくれますが、ファイルの作られ方に
よってはショートカットが作られないことがあります。

そこで、ショートカットが空だった場合の保険として、
形式ごとの「生の項目名」も順番に試すようにしました。

  TIT2 / TPE1 … MP3(ID3v2.3・2.4)で使われる項目名
  TT2  / TP1  … MP3(ID3v2.2、より古い形式)の項目名
  ©nam / ©ART … M4A・MP4で使われる項目名(先頭の記号も名前の一部)
  aART        … M4A のアルバムアーティスト(最後の保険)
============================================================
*/
const TITLE_FRAME_IDS = ["TIT2","TT2","©nam"];
const ARTIST_FRAME_IDS = ["TPE1","TP1","©ART","aART"];

/**
 * タグの中から、目的の文字列を取り出します。
 *
 * 【なぜこんな回り道が必要なのか(v70での修正理由)】
 *
 * v69では tags.title / tags.artist をそのまま使っていましたが、
 * 実機テストでアーティスト名が表示されませんでした。
 *
 * タグの値は、次の3つの形のどれかで入っている可能性があります。
 *
 *   ① 文字列そのまま            tags.artist = "山田太郎"
 *   ② オブジェクトの中のdata     tags.TPE1 = { data:"山田太郎", ... }
 *   ③ ショートカットが作られず、生の項目名にだけ入っている
 *
 * この関数は ①→②→③ の順に探しにいくので、
 * どの形で入っていても取り出せます。
 */
function pickTagValue(tags,shortcutName,frameIds){

    // --- ① ショートカット名(title / artist)で探す ---
    const shortcutValue = extractText(tags[shortcutName]);
    if(shortcutValue !== ""){
        return shortcutValue;
    }

    // --- ②③ 生の項目名を順番に試す ---
    for(const frameId of frameIds){
        const frameValue = extractText(tags[frameId]);
        if(frameValue !== ""){
            return frameValue;
        }
    }

    return "";

}

/*
値が「文字列」でも「{data:文字列} のオブジェクト」でも、
中の文字を取り出して返します。取れなければ空文字を返します。

trim() は文字列の前後の余分な空白を削る命令です。
タグには末尾に空白や余分な文字が入っていることがよくあります。
*/
function extractText(value){

    if(value === undefined || value === null){
        return "";
    }

    if(typeof value === "string"){
        return value.trim();
    }

    // typeof が "object" の時だけ .data を見にいきます。
    if(typeof value === "object" && typeof value.data === "string"){
        return value.data.trim();
    }

    return "";

}

/*
============================================================
【診断用】最初の数曲だけ、タグの中身を詳しくログに出します。

原因が特定できたら、この診断ログは削除してよい範囲です。
CLAUDE.mdの「本番リリース前に削除するもの」にも記載しています。
============================================================
*/
let tagDebugCount = 0;
const TAG_DEBUG_LIMIT = 3;

/**
 * jsmediatagsでタグを読み取ります。
 *
 * 【v70での変更】setTagsToRead() の指定を外しました。
 *
 * v69では読む項目を ["title","artist"] に絞って速くしていましたが、
 * 実機でアーティスト名が取得できなかったため、原因の切り分けとして
 * 「全部のタグを読む」方式に変更しています。
 * 絞り込みを外すことで、ショートカットが作られない形式のファイルでも
 * 生の項目名から値を拾えるようになります。
 *
 * ジャケット画像(picture)も一緒に読み込まれるようになりますが、
 * 1曲ずつ処理して使い終わったら捨てるため、メモリを溜め込むことは
 * ありません。STEP Bでジャケットを実装する際は、この1回の読み込みで
 * 文字と画像の両方を取得する形にすれば、ファイルを二度読む無駄が
 * 無くなります(その時に竹弘と設計を相談する)。
 */
function readTagsFromFile(file){

    return new Promise(function(resolve){

        /*
        jsmediatagsは「終わったらこの関数を呼んでね」というコールバック
        方式のライブラリで、そのままではawaitで待てません。
        そこでPromiseで包んで、awaitできる形に変換しています
        (コールバックをPromise化する定番の書き方)。

        失敗時もrejectせずresolve(null)にしているのは、
        タグが無いファイルは珍しくなく、それを「エラー」として
        扱うと解析全体が止まってしまうためです。
        */
        try{

            new jsmediatags.Reader(file).read({

                onSuccess:function(result){

                    if(tagDebugCount < TAG_DEBUG_LIMIT){
                        tagDebugCount = tagDebugCount + 1;
                        logTagDiagnostics(file,result);
                    }

                    resolve(result && result.tags ? result.tags : null);

                },

                onError:function(error){

                    if(tagDebugCount < TAG_DEBUG_LIMIT){
                        tagDebugCount = tagDebugCount + 1;
                        console.error(
                            "【診断】タグ読み取り失敗 :",
                            file.name,
                            "/ type=" + (error && error.type),
                            "/ info=" + (error && error.info)
                        );
                    }
                    else{
                        console.log("タグなし/読み取り不可 :",file.name);
                    }

                    resolve(null);

                }

            });

        }
        catch(error){
            console.error(
                "タグ読み取りで例外 :",
                file.name,
                error.name,
                error.message
            );
            resolve(null);
        }

    });

}

/*
取得したタグの中身をデバッグログに書き出します。
「何形式のファイルで、どんなキーが取れて、その中身がどうなっていたか」
が分かるので、表示できない原因を特定できます。
*/
function logTagDiagnostics(file,result){

    if(!result){
        console.error("【診断】結果が空 :",file.name);
        return;
    }

    console.log("【診断】" + file.name);
    console.log("   タグ形式 :",result.type,result.version || "");

    if(!result.tags){
        console.error("   tagsが空でした");
        return;
    }

    // Object.keys は「そのオブジェクトが持っているキー名の一覧」を返します。
    const keys = Object.keys(result.tags);

    console.log("   取得キー(" + keys.length + "個) :",keys.join(", "));
    console.log("   title  →",describeTagValue(result.tags.title));
    console.log("   artist →",describeTagValue(result.tags.artist));
    console.log("   TIT2   →",describeTagValue(result.tags.TIT2));
    console.log("   TPE1   →",describeTagValue(result.tags.TPE1));

}

/*
タグの値が「どんな形で入っているか」を人間が読める文字にします。
文字列なのかオブジェクトなのかを区別できるようにするのが目的です。
*/
function describeTagValue(value){

    if(value === undefined){ return "(キーなし)"; }
    if(value === null){ return "(null)"; }

    if(typeof value === "string"){
        return '"' + value + '" [文字列]';
    }

    if(typeof value === "object"){
        return "[オブジェクト] data=" + JSON.stringify(value.data);
    }

    return String(value) + " [" + (typeof value) + "]";

}

/**
 * 曲の長さ(秒)を実測します。
 *
 * 竹弘の指示「曲の長さが取得できない時は、一般的なプレイヤーと
 * 同じように算出表示する」への対応です。
 *
 * タグの中にも長さの情報(TLENフレーム)を持てる仕様はありますが、
 * 実際には入っていないファイルが多く、入っていても値が
 * 信頼できないことが知られています。そのため一般的な音楽プレイヤーは
 * 音声そのものを読んで長さを測っています。ここでも同じ方式を採ります。
 */
function measureDuration(file){

    return new Promise(function(resolve){

        const url = URL.createObjectURL(file);

        // new Audio() は、画面に出さない再生用の部品を作る命令です。
        const probe = new Audio();

        /*
        preload="metadata" は「曲全体ではなく、長さなどの基本情報だけ
        読み込む」指定です。曲を丸ごと読むより大幅に速く終わります。
        */
        probe.preload = "metadata";

        // 二重に終了処理が走らないようにする見張り役のフラグです。
        let settled = false;

        function finish(value){

            if(settled){ return; }
            settled = true;

            clearTimeout(timer);

            // 使い終わった一時URLを解放します(放置するとメモリを食い続けます)
            URL.revokeObjectURL(url);

            resolve(value);

        }

        /*
        コーデック非対応のファイルなどで、成功も失敗もせず
        永久に待たされてしまうことへの保険です。
        8秒で諦めて0(=長さ不明)として次へ進みます。
        */
        const timer = setTimeout(function(){
            console.log("長さの測定がタイムアウト :",file.name);
            finish(0);
        },8000);

        // 長さなどの基本情報が読めた時に呼ばれます。
        probe.onloadedmetadata = function(){
            finish(probe.duration);
        };

        probe.onerror = function(){
            finish(0);
        };

        probe.src = url;

    });

}

/**
 * 指定した曲の行だけを作り直して差し替えます。
 */
function refreshRow(trackId){

    /*
    querySelectorに文字列を埋め込む方式は、track_idに記号が
    含まれていた場合に壊れる恐れがあるため、
    地道に全行を見て一致するものを探しています。
    (曲数が数百でも、DOMを作り直すより軽い処理です)
    */
    const rows = menuListEl.querySelectorAll(".music-row");

    let targetRow = null;

    for(const row of rows){
        if(row.dataset.trackId === trackId){
            targetRow = row;
            break;
        }
    }

    if(!targetRow){ return; }

    /*
    掴んでドラッグしている最中の行は差し替えません。
    浮遊中の行を作り直すと、指との位置関係や
    並び替えの状態が壊れてしまうためです。
    */
    if(targetRow === draggingRow){ return; }

    const newRow = createRowElement(trackId);
    if(!newRow){ return; }

    // replaceWith は「この要素を別の要素と入れ替える」標準の命令です。
    targetRow.replaceWith(newRow);

}

/**
 * 解析状況ランプの表示を切り替えます。
 *
 * phase 1 … 黄・速い点滅  「曲データ取込中」
 * phase 2 … 緑・普通の点滅「ジャケ写同期」(STEP Bで使用)
 * phase 3 … 青・常時点灯  「全工程完了」→5秒後に消滅
 */
function setLampPhase(phase,doneCount,totalCount){

    const lamp = document.getElementById("ofs-lamp");
    const lampText = document.getElementById("ofs-lamp-text");
    const lampIcon = document.getElementById("ofs-lamp-icon");

    if(!lamp || !lampText || !lampIcon){ return; }

    lampPhase = phase;

    lamp.style.display = "flex";
    lamp.style.opacity = "1";

    if(phase === 1){

        lamp.style.background = "#fff9e6";
        lamp.style.color = "#ff9500";
        lampText.innerText = "曲データ取込中" + buildProgressText(doneCount,totalCount);
        lampIcon.innerText = "🟡";
        lampIcon.className = "blink-fast";

    }
    else if(phase === 2){

        lamp.style.background = "#f2fbe6";
        lamp.style.color = "#34c759";
        lampText.innerText = "ジャケ写同期" + buildProgressText(doneCount,totalCount);
        lampIcon.innerText = "🟢";
        lampIcon.className = "blink-normal";

    }
    else if(phase === 3){

        lamp.style.background = "#e6f6ff";
        lamp.style.color = "#007aff";
        lampText.innerText = "全工程完了";
        lampIcon.innerText = "🔵";

        // classNameを空にして点滅アニメを解除し、常時点灯にします。
        lampIcon.className = "";

        hideLampAfterDelay();

    }

}

/*
異常を知らせる赤いランプを出します(消えません)。

ライブラリの読み込み失敗のように「竹弘が気づかないと
先に進めない問題」を、画面上ではっきり伝えるためのものです。
通常のフェーズ表示と違い、自動では消しません。
*/
function showLampError(message){

    const lamp = document.getElementById("ofs-lamp");
    const lampText = document.getElementById("ofs-lamp-text");
    const lampIcon = document.getElementById("ofs-lamp-icon");

    if(!lamp || !lampText || !lampIcon){ return; }

    lamp.style.display = "flex";
    lamp.style.opacity = "1";
    lamp.style.background = "#ffebe6";
    lamp.style.color = "#ff453a";

    lampText.innerText = message;
    lampIcon.innerText = "⚠️";
    lampIcon.className = "blink-fast";

}

/*
「3/50」のような進捗の文字を作ります。
解析対象が無い場合は何も付けません。
*/
function buildProgressText(doneCount,totalCount){

    if(!totalCount){ return ""; }

    return " " + doneCount + "/" + totalCount;

}

/*
完了の余韻を5秒キープしてから、0.5秒かけてフワッと消します。
(CSSのtransition:opacityが効くため、opacityを0にするだけで
 滑らかに消えていきます)
*/
function hideLampAfterDelay(){

    setTimeout(function(){

        const lamp = document.getElementById("ofs-lamp");
        if(!lamp){ return; }

        lamp.style.opacity = "0";

        setTimeout(function(){
            lamp.style.display = "none";
        },500);

    },5000);

}


// ==========================================================
// 7. 画面起動
// ==========================================================

loadMenuData();

</script>
