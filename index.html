<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>実験2: AudioContext予約再生テスト</title>
<style>
    body{
        font-family:sans-serif;
        background:#111;
        color:#eee;
        padding:16px;
        margin:0;
    }
    h1{ font-size:1.1rem; }
    p{ font-size:0.85rem; color:#aaa; line-height:1.5; }
    button{
        display:block;
        width:100%;
        box-sizing:border-box;
        font-size:1rem;
        padding:14px;
        margin:8px 0;
        border-radius:8px;
        border:1px solid #555;
        background:#222;
        color:#eee;
    }
    button:disabled{ opacity:0.4; }
    #status{ font-size:0.95rem; margin:10px 0; color:#7cf; }
    #log{
        white-space:pre-wrap;
        word-break:break-all;
        background:#000;
        color:#7CFC90;
        font-family:monospace;
        font-size:0.7rem;
        line-height:1.4;
        padding:10px;
        height:45vh;
        overflow-y:auto;
        border:1px solid #444;
        border-radius:8px;
        margin-top:12px;
    }
</style>
</head>
<body>

<!--
======================================================================
 実験2: AudioContext(Web Audio API)による予約再生テスト

----------------------------------------------------------------------

【これは何か】

 ノリRun本体とは完全に切り離した、検証専用の使い捨てページです。
 sandbox/index.html なので、リポジトリ直下の本物のindex.html
 (ノリRun本体の入口)には一切影響しません。

 このファイルは実験1(audio.loopテスト)の内容を上書きしています。
 実験1は「曲の長さに関わらず必ず3周目でJSのplay()呼び出しが
 邪魔される」→「loop属性(JSがplay()を呼ばない方式)なら
 何十周でも止まらない」ことを実証済みです(2026-08-23、成功)。

【今回検証すること(実験2)】

 竹弘の発案: legacyのver8.5仕様書にあった「曲接続モジュール」の
 設計(AudioContextの絶対時刻で次の曲の再生開始を「予約」する
 start(when) 方式)を、ロック中の再生継続に応用できないか。

 予約(start(when))自体は、その前に「曲データをデコードして
 生の波形を用意しておく」という重い作業が必要です(竹弘との
 相談で確認済み)。デコード済みの曲は事前にまとめて予約できますが、
 メモリの都合で無制限には予約できません。

 そこで、次の2段階を試します。

   段階A: ロック前に、曲を2つぶんまとめて予約しておく
          (「先読みバッファ」を作った状態でロックする)
   段階B: ロック中、予約の残りが少なくなるたびに、その場で
          新しく曲をデコードして追加予約する(自動で繰り返す)

 段階Aが成功するのは想定内(先に予約済みのものは鳴るはず)。
 **本当に知りたいのは段階B**です。ロック中に新しくデコード+予約
 する処理そのものが成功し続けるなら、理論上いくらでも曲を
 繋げられることになります。失敗するなら、事前に予約できた分が
 上限、ということになります。

 あわせて AudioContext 自体の state(running/suspended)も
 監視します。もしブラウザがAudioContextごと止めてくるなら、
 ここに "suspended" という記録が残るはずです。

【使い方】

 1. 「①曲ファイルを選ぶ」で 010 クイズ開始_1.mp3 を選ぶ
 2. 「②予約開始」をタップ(最初の2曲ぶんをまとめて予約します)
 3. 画面をロックして放置
 4. 時々ロックを解除して、下のログを確認
 5. 「ログをコピー」でクリップボードにコピーできます

 ログの中で特に注目してほしい行:

   予約成功 : N曲目             … 予約そのものは順調に進んでいる
   ★ N曲目 再生終了(ended)     … 実際に鳴り終わった曲の数
   ★ AudioContext statechange  … ブラウザがcontext自体を止めたか
   ★★★ decodeAndSchedule失敗   … ロック中の追加予約が失敗した瞬間
======================================================================
-->

<h1>実験2: AudioContext予約再生 テスト</h1>
<p>
    010 クイズ開始_1.mp3 を選んで再生。最初に2曲ぶん予約し、
    以後は残りが減るたびにロック中でも自動で追加予約します。
    追加予約が成功し続けるかが今回の本題です。
</p>

<button id="pick-btn">① 曲ファイルを選ぶ</button>
<button id="play-btn" disabled>② 予約開始</button>
<button id="copy-btn">ログをコピー</button>
<button id="clear-btn">ログをクリア</button>

<div id="status">未選択</div>

<div id="log"></div>

<script>

// ==========================================================
// ログ(localStorageに残す。ページが作り直されても消えない)
// ==========================================================

const LOG_KEY = "schedule_test_log";
const LOG_MAX = 800;

const logEl = document.getElementById("log");

function pad(value,length){
    return String(value).padStart(length || 2,"0");
}

function timestamp(){
    const d = new Date();
    return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) +
        "." + pad(d.getMilliseconds(),3);
}

function log(message){

    const stored = localStorage.getItem(LOG_KEY);
    const lines = stored ? JSON.parse(stored) : [];

    lines.push(timestamp() + " | " + message);

    while(lines.length > LOG_MAX){
        lines.shift();
    }

    localStorage.setItem(LOG_KEY,JSON.stringify(lines));

    renderLog();

}

function renderLog(){

    const stored = localStorage.getItem(LOG_KEY);
    const lines = stored ? JSON.parse(stored) : [];

    logEl.textContent = lines.join("\n");
    logEl.scrollTop = logEl.scrollHeight;

}

renderLog();
log("=== ページ読み込み ===");


// ==========================================================
// 画面部品
// ==========================================================

const statusEl = document.getElementById("status");
const pickBtn = document.getElementById("pick-btn");
const playBtn = document.getElementById("play-btn");
const copyBtn = document.getElementById("copy-btn");
const clearBtn = document.getElementById("clear-btn");

let fileHandle = null;
let audioContext = null;

// 「今から何秒後まで予約が埋まっているか」を表す、次に予約すべき開始時刻
let nextStartTime = 0;

// 予約に成功した回数
let scheduledCount = 0;

// 実際に鳴り終わった(ended)回数
let endedCount = 0;


// ==========================================================
// ①曲ファイルを選ぶ
// ==========================================================
pickBtn.addEventListener("click",async function(){

    try{

        const [handle] = await window.showOpenFilePicker({
            types:[{
                description:"音楽ファイル",
                accept:{"audio/*":[".mp3",".m4a",".wav"]}
            }]
        });

        fileHandle = handle;
        statusEl.textContent = "選択済み: " + handle.name;
        playBtn.disabled = false;

        log("ファイル選択 : " + handle.name);

    }
    catch(error){

        log("ファイル選択キャンセル/失敗 : " + error.name);

    }

});


// ==========================================================
// デコード+予約(この関数がロック中に自動で繰り返し呼ばれます)
// ==========================================================
/**
 * 曲データをデコードし、続きの時刻に再生を予約します。
 *
 * 【竹弘との確認事項】
 * 「予約」は start(when) の呼び出しだけでなく、その前段の
 * デコード(decodeAudioData)も含めて1セットです。ここでは
 * 毎回ファイルの読み込みからやり直しており、キャッシュした
 * デコード結果を使い回していません。ロック中に「デコードという
 * 重い処理そのもの」が成功するかも一緒に確認したいためです。
 */
async function decodeAndSchedule(){

    const label = (scheduledCount + 1) + "曲目";

    log(label + " : decodeAndSchedule開始");

    try{

        const file = await fileHandle.getFile();
        const arrayBuffer = await file.arrayBuffer();

        log(label + " : ArrayBuffer取得完了、デコード開始");

        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

        log(label + " : デコード完了(長さ=" + audioBuffer.duration.toFixed(2) + "秒)");

        const source = audioContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioContext.destination);

        const startAt = nextStartTime;
        const thisNumber = scheduledCount + 1;

        source.addEventListener("ended",function(){
            endedCount++;
            log("★ " + thisNumber + "曲目 再生終了(ended) / 累計終了=" + endedCount);
        });

        source.start(startAt);

        scheduledCount++;

        log(
            "予約成功 : " + label +
            " / 開始時刻=" + startAt.toFixed(2) +
            " / 今のcontext時刻=" + audioContext.currentTime.toFixed(2)
        );

        nextStartTime = startAt + audioBuffer.duration;

    }
    catch(error){

        log("★★★ " + label + " decodeAndSchedule失敗 : " + error.name + " / " + error.message);

    }

}


// ==========================================================
// ②予約開始
// ==========================================================
playBtn.addEventListener("click",async function(){

    if(!fileHandle){ return; }

    /*
    AudioContextの生成・開始にはユーザー操作(このタップ)が
    必要です。これがないと state が "suspended" のまま始まります。
    */
    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    log("AudioContext作成 : 初期state=" + audioContext.state);

    audioContext.addEventListener("statechange",function(){
        log("★ AudioContext statechange → " + audioContext.state);
    });

    // 少し先(0.2秒後)を1曲目の開始時刻にします(0だと過去扱いになる恐れがあるため)
    nextStartTime = audioContext.currentTime + 0.2;

    // まず2曲ぶん、まとめて予約します(ロック前の「先読み」を再現)
    await decodeAndSchedule();
    await decodeAndSchedule();

    playBtn.disabled = true;
    statusEl.textContent = "予約済み。ロックして様子を見てください";

});


// ==========================================================
// ログのコピー/クリア
// ==========================================================
copyBtn.addEventListener("click",function(){

    const stored = localStorage.getItem(LOG_KEY);
    const text = stored ? JSON.parse(stored).join("\n") : "";

    navigator.clipboard.writeText(text).then(function(){

        const original = copyBtn.textContent;
        copyBtn.textContent = "コピーしました";
        setTimeout(function(){ copyBtn.textContent = original; },1500);

    }).catch(function(error){

        copyBtn.textContent = "コピー失敗";
        console.error("コピー失敗 :",error.name,error.message);

    });

});

clearBtn.addEventListener("click",function(){
    localStorage.removeItem(LOG_KEY);
    renderLog();
});


// ==========================================================
// ブラウザ・OS側の合図を記録する
// ==========================================================

document.addEventListener("visibilitychange",function(){
    log("visibilitychange → " + document.visibilityState);
});

window.addEventListener("pagehide",function(event){
    log("pagehide (persisted=" + event.persisted + ")");
});

window.addEventListener("pageshow",function(event){
    log("pageshow (persisted=" + event.persisted + ")");
});

document.addEventListener("freeze",function(){
    log("★ document 'freeze' イベント発火(ブラウザがページを凍結しました)");
});

document.addEventListener("resume",function(){
    log("★ document 'resume' イベント発火(凍結から復帰しました)");
});


// ==========================================================
// 心拍ログ + 自動補充(ここが実験の本題)
// ==========================================================
/*
3秒おきに、次の2つを行います。

  1. 心拍ログ(context.state / context.currentTime / 予約数など)
  2. 予約の残り時間が5秒を切っていたら、追加でデコード+予約する
     (これがロック中でも動き続けるかどうかが、今回知りたいことです)
*/
setInterval(async function(){

    if(!audioContext){ return; }

    const remaining = nextStartTime - audioContext.currentTime;

    log(
        "心拍: state=" + audioContext.state +
        " context時刻=" + audioContext.currentTime.toFixed(2) +
        " 予約数=" + scheduledCount +
        " 終了数=" + endedCount +
        " 残り予約時間=" + remaining.toFixed(2) + "秒" +
        " visibility=" + document.visibilityState
    );

    if(remaining < 5){

        log("→ 残りが少ないため、追加予約を試みます");
        await decodeAndSchedule();

    }

},3000);

</script>
</body>
</html>
