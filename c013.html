<script>

/*
------------------------------------------------------------
console.log / console.error を上書きして、

「元々の動き(PCのDevToolsに出す)」

に加えて、

「画面上のパネルにも表示する」

処理を追加しています。

こうすることで、既存のコードにある
console.log(...) の呼び出しは
一切変更しなくても、
自動的に画面にも表示されるようになります。
------------------------------------------------------------
*/
(function(){

    const logBody =
    document.getElementById("debug-log-body");

    /*
    複数の引数を、画面表示用の
    1行の文字列にまとめる関数です。
    */
    function formatArgs(args){

        return Array.prototype.map.call(

            args,

            function(value){

                if(typeof value === "object" && value !== null){

                    /*
                    FileSystemHandleやErrorなどは
                    中身が空に見えることがありますが、
                    今回の確認用途(ファイル名の一覧確認)
                    では文字列の引数がそのまま
                    表示できれば十分です。
                    */
                    try{
                        return JSON.stringify(value);
                    }
                    catch(e){
                        return String(value);
                    }

                }

                return String(value);

            }

        ).join(" ");

    }

    function appendLine(text,isError){

        const line = document.createElement("div");

        if(isError){
            line.style.color = "#ff453a";
        }

        line.textContent = text;

        logBody.appendChild(line);

        // 常に最新行が見えるよう、一番下へスクロールします。
        logBody.scrollTop = logBody.scrollHeight;

    }

    const originalConsoleLog = console.log;

    console.log = function(){

        originalConsoleLog.apply(console,arguments);

        appendLine(formatArgs(arguments),false);

    };

    const originalConsoleError = console.error;

    console.error = function(){

        originalConsoleError.apply(console,arguments);

        appendLine("[ERROR] " + formatArgs(arguments),true);

    };

    document.getElementById("debug-log-clear").onclick =

    function(){

        logBody.innerHTML = "";

    };

})();

</script>

<script>

/* ==========================================================
   JavaScript

   NoriRunでは

   「画面」
   「DB」
   「フォルダ」
   「曲情報」

   の順番でプログラムを並べます。

   どの画面でも同じ並びにすることで、
   後から見ても迷わないようにします。

========================================================== */

// ==========================================================
// 0. 定数定義
// ==========================================================
/*
------------------------------------------------------------

定数とは

一度決めたら変更しない値です。

例えば

DB名

ストア名

画面名

などを書きます。

後で名前を変更するときも、
ここだけ直せば済みます。

------------------------------------------------------------
*/

// ------------------------------
// データベース名
// ------------------------------

const DB_NAME = "NoriRunDB";

// ------------------------------
// IndexedDB Version
//
// Versionが変わると
// onupgradeneeded が実行されます。
// ------------------------------

const DB_VERSION = 1;


// ------------------------------
// ストア名
// ------------------------------

// アプリ設定
const STORE_SETTINGS = "settings";

// 曲マスター
const STORE_MUSIC = "music_library";

// プレイリスト
const STORE_PLAYLISTS = "playlists";

// Musicフォルダ管理
const STORE_FOLDER_ROOTS = "folder_roots";


// ------------------------------
// Musicフォルダ管理番号
//
// c012で保存した
// Musicフォルダを取得するときに使用します。
//
// 将来固定文字列ではなく
// DBから取得する予定です。
// ------------------------------

const ROOT_MUSIC_ID = "root_music";

// ==========================================================
// 1. 画面部品取得
// ==========================================================

/*
------------------------------------------------------------

画面にある部品を取得します。

HTMLで

id="○○"

と書いた部品は

JavaScriptから

getElementById()

で取得できます。

取得すると

文字を書き換えたり

ボタンを押したり

色を変えたりできます。

------------------------------------------------------------
*/


// アプリ全体

const app = document.getElementById("app");


// Musicフォルダ確認ボタン

const startButton =
document.getElementById("start-button");

// ============================================================
// 実行中だけ使用するMap
// （曲のFileHandle保存用Map）
// ============================================================

/*
Map（マップ）

とは

「実行中だけ使う高速メモ帳」

です。

今回は

track_id

　↓

FileHandle

を保存するために使用します。

※ IndexedDBには保存しません。

アプリを終了すると、
Mapの中身は自動で消えます。
*/
const runtimeFileHandleMap = new Map();

// ==========================================================
// 2. IndexedDBを開く
// ==========================================================

/*
------------------------------------------------------------

この関数は

NoriRunDBへ接続する共通関数です。

画面のどこからでも

DBを使いたい時は

必ずこの関数を呼びます。

------------------------------------------------------------
*/

function openNoriRunDB(){

    /*
    Promiseとは

    「終わったら教えるよ」

    という約束です。

    IndexedDBは

    開くまで少し時間が掛かるため

    Promiseを使用します。
    */

    return new Promise(

        function(resolve,reject){

            /*
            indexedDB.open()

            DBを開きます。
            */

            const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );

            /*
            DBが存在しない時だけ
            実行されます。
            */

            request.onupgradeneeded =

            function(event){

                console.log(
                    "NoriRunDB 新規作成"
                );

            };

            /*
            接続成功
            */

            request.onsuccess =

            function(event){

                console.log(
                    "NoriRunDB 接続成功"
                );

                resolve(
                    event.target.result
                );

            };

            /*
            接続失敗
            */

            request.onerror =

            function(){

                reject(
                    "DB接続失敗"
                );

            };

        }

    );

}

// ==========================================================
// 3-1.
// DB共通関数
//
// 1件取得
// ==========================================================

/*
------------------------------------------------------------

この関数は

IndexedDBから

「1件だけ」

データを取得します。

例えば

設定情報

Musicフォルダ情報

1曲だけ

などを取得するときに使用します。

------------------------------------------------------------

使い方

const data =
await idbGet(
    STORE_SETTINGS,
    "volume"
);

------------------------------------------------------------
*/

function idbGet(storeName,key){

    /*
    Promiseを返します。

    asyncを付けることで

    await

    が使えるようになります。
    */

    return new Promise(

        async function(resolve,reject){

            try{

                /*
                DBへ接続
                */

                const db =
                await openNoriRunDB();

                /*
                transaction開始

                readonlyなので

                読むだけです。
                */

                const tx =
                db.transaction(
                    storeName,
                    "readonly"
                );

                /*
                ストア取得
                */

                const store =
                tx.objectStore(
                    storeName
                );

                /*
                指定キー取得
                */

                const request =
                store.get(key);

                /*
                読み込み成功
                */

                request.onsuccess =
                function(){

                    /*
                    DBを閉じる

                    開きっぱなし防止
                    */

                    db.close();

                    /*
                    呼び出し元へ返す
                    */

                    resolve(
                        request.result
                    );

                };

                /*
                読み込み失敗
                */

                request.onerror =
                function(){

                    db.close();

                    reject(
                        "データ取得失敗"
                    );

                };

            }

            /*
            tryの途中で

            エラーになった場合
            */

            catch(error){

                reject(error);

            }

        }

    );

}

// ==========================================================
// 3-2.
// DB共通関数
//
// 1件保存
// ==========================================================

/*
------------------------------------------------------------

この関数は

IndexedDBへ

「1件だけ」

データを保存します。

------------------------------------------------------------

使用例

await idbPut(

    STORE_MUSIC,

    track

);

------------------------------------------------------------

settingsストアだけは

キー(Key)

と

値(Value)

を別々に保存します。

music_libraryなどは

オブジェクトの中に

主キー(track_id)

が入っているので

keyは不要です。

------------------------------------------------------------
*/

function idbPut(storeName,value,key){

    /*
    Promiseを返します。

    保存が終わるまで待つため

    Promiseを使用します。
    */

    return new Promise(

        async function(resolve,reject){

            try{

                /*
                DBへ接続します。
                */

                const db =
                await openNoriRunDB();

                /*
                readwrite

                =

                読み書き可能

                という意味です。

                保存するため

                readonlyではなく

                readwrite

                を使用します。
                */

                const tx =
                db.transaction(

                    storeName,

                    "readwrite"

                );

                /*
                ストア取得
                */

                const store =
                tx.objectStore(

                    storeName

                );

                /*
                keyがあるか判定します。

                settings

                のような

                Key-Value型だけ

                keyを指定します。

                music_library

                は

                track_id

                が入っているので

                key不要です。
                */

                if(key===undefined){

                    store.put(value);

                }
                else{

                    store.put(

                        value,

                        key

                    );

                }

                /*
                保存完了
                */

                tx.oncomplete =

                function(){

                    /*
                    DBを閉じます。
                    */

                    db.close();

                    /*
                    呼び出し元へ

                    保存成功

                    を返します。
                    */

                    resolve();

                };

                /*
                保存失敗
                */

                tx.onerror =

                function(){

                    db.close();

                    reject(

                        "保存失敗"

                    );

                };

            }

            /*
            try中でエラー発生
            */

            catch(error){

                reject(error);

            }

        }

    );

}

// ==========================================================
// 3-3.
// DB共通関数
//
// 全件取得
// ==========================================================
/*
------------------------------------------------------------

この関数は

指定したストアの

全データ

を取得します。

------------------------------------------------------------

使用例

const tracks =
await idbGetAll(
    STORE_MUSIC
);

------------------------------------------------------------

戻り値は

配列(Array)

になります。

例

[
    曲①,
    曲②,
    曲③
]

------------------------------------------------------------
*/

function idbGetAll(storeName){

    /*
    Promiseを返します。

    全件取得が終わるまで待ちます。
    */

    return new Promise(

        async function(resolve,reject){

            try{

                /*
                DBへ接続
                */

                const db =
                await openNoriRunDB();

                /*
                読み込み専用
                */

                const tx =
                db.transaction(

                    storeName,

                    "readonly"

                );

                /*
                ストア取得
                */

                const store =
                tx.objectStore(

                    storeName

                );

                /*
                全件取得します。
                */

                const request =
                store.getAll();

                /*
                読み込み成功
                */

                request.onsuccess =
                function(){

                    /*
                    DBを閉じます。
                    */

                    db.close();

                    /*
                    request.result

                    には

                    配列(Array)

                    が入っています。

                    データが0件でも

                    []

                    が返るので安心です。
                    */

                    resolve(

                        request.result

                    );

                };

                /*
                読み込み失敗
                */

                request.onerror =
                function(){

                    db.close();

                    reject(

                        "全件取得失敗"

                    );

                };

            }

            /*
            try内エラー
            */

            catch(error){

                reject(error);

            }

        }

    );

}
// ============================================================
// 4. Musicフォルダ取得
// ============================================================
/**
 * ===========================================================
 * Musicフォルダ情報取得
 * ===========================================================
 *
 * c012で保存した
 * Musicフォルダ情報を取得します。
 *
 * この関数では
 * Musicフォルダ自体はまだ読みません。
 *
 * 保存してある
 * 「Musicフォルダの鍵」
 * を取得するだけです。
 */
async function getMusicFolderHandle(){

    /*
    folder_rootsストアから

    Musicフォルダ情報を1件取得します。
    */

    const folderData =
    await idbGet(

        STORE_FOLDER_ROOTS,

        ROOT_MUSIC_ID

    );

    /*
    保存されていない場合
    */

    if(!folderData){

        throw new Error(

            "Musicフォルダ情報が見つかりません。"

        );

    }

    /*
    フォルダの鍵が無い場合
    */

    if(!folderData.root_folder_handle){

        throw new Error(

            "Musicフォルダの鍵がありません。"

        );

    }

    /*
    取得成功
    */

    console.log(

        "Musicフォルダ取得成功",

        folderData

    );

    /*
    root_folder_handleだけ返します。
    */

    return folderData.root_folder_handle;

}
/**
 * ===========================================================
 * Musicフォルダを再帰的にスキャンする関数
 * ===========================================================
 *
 * 指定したフォルダの中を調べて、
 * ファイルを1つ見つけるたびに
 * 呼び出し元へ順番に渡します。
 *
 * サブフォルダが見つかった場合は、
 * その中も同じ処理で調べにいきます
 * (自分自身をもう一度呼び出す＝再帰処理)。
 *
 * こうすることで、
 *
 * Musicフォルダ/
 *   J-POP/
 *     曲A.mp3
 *   洋楽/
 *     曲B.mp3
 *
 * のように、Musicフォルダの下に
 * サブフォルダが何段あっても、
 * 中の曲ファイルを全部見つけられます。
 *
 * ※ フォルダの権限(queryPermission)は
 *    一番上のフォルダ(root)で確認すれば、
 *    その中のサブフォルダにも同じ権限が
 *    自動的に有効になります。
 *    サブフォルダごとに権限を取り直す必要はありません。
 *
 * async function* は
 * 「async generator(非同期ジェネレーター)」という書き方です。
 * for await (const x of ...) と組み合わせて使うと、
 * 見つかったファイルを1つずつ順番に受け取れます。
 */
async function* scanFolderRecursively(dirHandle){

    for await(const entry of dirHandle.values()){

        if(entry.kind === "file"){

            /*
            ファイルなら、
            呼び出し元へそのまま渡します。
            */

            yield entry;

        }
        else if(entry.kind === "directory"){

            /*
            フォルダなら、
            その中も同じ関数で調べます。

            yield* は
            「呼び出した先が渡してくるものを
              そのまま全部中継する」という書き方です。
            */

            yield* scanFolderRecursively(entry);

        }

    }

}

/**
 * ===========================================================
 * Musicフォルダ確認
 * ===========================================================
 *
 * 「Musicフォルダ確認」ボタンが押された時に実行します。
 *
 * この段階では
 * Musicフォルダの中(サブフォルダ含む)を読み込み、
 * FileHandleをMapへ保存できるか確認します。
 */
async function checkMusicFolder(){

    try{

        /*
        Musicフォルダの鍵を取得します。
        */

        const folderHandle =
        await getMusicFolderHandle();

        /*
        ======================================================
        アクセス権限を確認し直します(重要)
        ======================================================

        c012でMusicフォルダの許可をもらっていても、

        ・時間が経った
        ・別のページ(フルページ遷移)を経由した

        などの理由で、ブラウザが
        「まだ許可されているか」を
        忘れてしまうことがあります。

        フォルダの中身を読む前に、
        必ずここで権限を確認し直します。
        */

        let permission =
        await folderHandle.queryPermission(
            { mode: "read" }
        );

        /*
        許可が残っていない場合は
        ここで許可をお願いします。

        requestPermission()は
        ユーザー操作(クリック)の中でしか
        呼び出せません。

        checkMusicFolder()は
        「Musicフォルダ確認」ボタンの
        クリックから呼ばれているので、
        ここで呼んでも問題ありません。
        */

        if(permission !== "granted"){

            permission =
            await folderHandle.requestPermission(
                { mode: "read" }
            );

        }

        /*
        それでも許可されなかった場合は
        ここで処理を止めます。
        */

        if(permission !== "granted"){

            throw new Error(
                "Musicフォルダへのアクセスが許可されませんでした。もう一度「Musicフォルダ確認」を押してください。"
            );

        }

        console.log(

            "権限確認OK :",

            permission

        );

        /*
        コンソールへ表示します。
        */

        console.log(

            "取得したフォルダ",

            folderHandle

        );

        // 開発確認用（正式版では削除）
        alert(

            "取得したフォルダ : " +

            folderHandle.name

        );

        /*
        ======================================================

        Musicフォルダの中(サブフォルダ含む)を読み込みます。

        scanFolderRecursively()

        は

        Musicフォルダの中と、

        その中にあるサブフォルダの中も

        全部まとめて、ファイルだけを

        順番に取り出してくれます。

        ======================================================
        */

        console.log("----------");

        console.log("Musicフォルダ内(サブフォルダ含む)");

        for await(

            const fileEntry

            of

            scanFolderRecursively(folderHandle)

        ){

            /*
            fileEntry

            は

            Musicフォルダ内(サブフォルダ含む)で見つかった

            1件分のファイルです。

            scanFolderRecursively()の中で

            すでに「ファイルだけ」に絞っているので、

            ここでフォルダかどうかの判定は不要です。
            */

            console.log(

                "名前 :",

                fileEntry.name

            );

            /*
            ======================================================
            同じファイル名の重複を読み飛ばします。
            ======================================================

            違うサブフォルダに

            同じ名前の曲ファイルがあった場合、

            竹弘の指示により

            「後から見つかった方」は登録せず

            読み飛ばします(最初に見つかった方を残します)。
            */

            if(runtimeFileHandleMap.has(fileEntry.name)){

                console.log(

                    "重複のため読み飛ばし :",

                    fileEntry.name

                );

                continue;

            }

            /*
            ======================================================
            Mapへ登録します。
            ======================================================

            fileEntry は

            FileSystemFileHandle

            なので、

            そのままMapへ保存できます。

            Key   ：ファイル名

            Value ：FileHandle

            ※ 今は動作確認のため
               ファイル名をキーにしています。

            将来は

            track_id

            をキーへ変更します。

            ここでは

            Mapへ保存するだけです。

            まだIndexedDBへの登録は行いません。
            */

            runtimeFileHandleMap.set(

                fileEntry.name,

                fileEntry

            );

            console.log(

                "Map登録 :",

                fileEntry.name

            );

            console.log("----------");

        }

        /*
        ======================================================

        ここまで来たということは、

        Musicフォルダ内を

        最後まで読み終わった

        ということです。

        ======================================================
        */

        alert(

            "Musicフォルダ読込成功"

        );

    }
    catch(error){

        console.error(error);

        alert(

            error.message

        );

    }

}

// ============================================================
// 6. イベント登録
// ============================================================
/*
============================================================

Musicフォルダ確認ボタン

startButton が"click"されたら、
checkMusicFolder関数(Musicフォルダ取得)
を実行してください

============================================================
*/

startButton.addEventListener(

    "click",

    checkMusicFolder

);
