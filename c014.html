<!--
======================================================================
 c014(メインメニュー・曲一覧・再生・並び替え)

 NoriRun Phase2

 【画面名】
 メインメニュー

----------------------------------------------------------------------

【この画面の役割】

① c013までに登録したmusic_libraryの曲を一覧表示する

② 曲をタップして再生する

③ 曲順をドラッグ&ドロップで並び替え、playlistsへ保存する

----------------------------------------------------------------------

【このSTEPで実装する内容】

STEP01
    曲一覧表示(music_libraryから取得)

STEP02
    再生ボタンで曲を再生する

STEP03
    並び替え(OFS: On-Demand Floating Sort)を移植し、
    playlistsへ並び順を保存する

----------------------------------------------------------------------

【使用するIndexedDB】

music_library(読み取りのみ)
playlists(読み書き、main_menu_defaultキー)

----------------------------------------------------------------------

【今回は範囲外の機能】

・タップ補正(ノリノリ設定)は別モジュールのため、今回は再生ボタンに置き換える
・ビートマッチング(設定BPMに合わせた再生・接続)は未実装。
  今回は曲を普通の速さで再生するだけ

----------------------------------------------------------------------

【並び替えエンジンについて】

legacy/ver8.5-gemini の「OFS(On-Demand Floating Sort)」モジュールを
移植したもの。ただし、OFSは元々 music_library の file_path をキーに
していたが、現行スキーマ(docs/db-schema.md)は track_id が主キーのため、
track_id 基準に置き換えている。playlistsストアの保存フィールドも
file_path_list ではなく track_id_list(現行スキーマ通り)を使用する。

    に変更。まず文字の種類でグループ分けし、その中で localeCompare を
    使う二段構えにしている。

    ※ 竹弘の本来の希望は「漢字も読み方(ふりがな)でひらがなと混ぜて
      並べる」だったが、漢字の読みは文字自体には入っておらず、
      実現には数MBの日本語辞書ライブラリが必要になる。ランニング中に
      使うオフライン前提のアプリには重すぎるため、竹弘の指示により
      文字種グループ方式を採用した。
      (音楽ファイルのタグに「並べ替え用ふりがな」が入っている場合が
       あり、それを使えば一部の曲は読み順にできる。将来の改善候補)

    あわせて、ノリ注入順の判定から「注入済みだが日時不明」の
    グループを削除した。日時の記録開始(v79)より前に🕺にした曲の
    ための処理だったが、dbclrでDBをクリアすれば消えるものであり、
    リリース時には存在しないため(竹弘の指摘)。

    (v83)【並び順の修正】半角カタカナ(ｱｲｳ)の曲が記号として一番下に
    並んでしまう問題を修正(竹弘の指摘)。

    半角カタカナは全角カタカナとは別の文字として扱われるため、
    どのグループにも入らず記号扱いになっていた。

    比べる前に normalize("NFKC") で表記を揃える方式にした。
        ｱｲｳ → アイウ / ｶﾞ → ガ / Ａ０ → A0 / Ⅰ → I
    半角で書かれていても全角で書かれていても同じ場所に並ぶ。
    並び順を決めるためだけに使い、画面に表示する文字は元のまま。

    あわせて「・」(中点)を記号グループへ移した。文字コードの並び上
    カタカナの仲間に入っているが、実際は記号のため。

    判定は18パターンで検証済み(ひらがな/全角・半角カタカナ/長音符/
    漢字/々/全角・半角英数字/記号/中点/句点/括弧)。

    (v84)【並び順の修正】ノリ注入順をメニューから選んだ時、まだ
    ノリを入れていない曲(🛌)が上に来てしまう問題を修正。

    原因は比較の向き。applySort() は降順の時に「比べた答えの符号を
    ひっくり返す」作りになっているため、compareByNori() は必ず
    昇順の並び(小さい・古い・まだのものが先)を返す必要があった。
    ところが「注入済みが先」という降順の並びを返していたため、
    降順で選ぶとひっくり返って🛌が上に来ていた。

    compareByNori() が昇順の並びを返すよう修正。これで

        降順(▼)… 注入済み(新しい順) → まだの曲(🛌)  ← 初回
        昇順(▲)… まだの曲(🛌) → 注入済み(古い順)

    となり、メニューから選んだ瞬間はノリ注入曲が必ず一番上に来る。

    ※ ノリ注入曲を上に持ってくるのは「降順」が正しい。注入日時が
      新しい順に並ぶため、また未注入は日時を持たない(最小値扱い)ため。
      🆕 登録日時順も初回は降順(新しい順)で、考え方が揃っている。

    (v85)【曲順を一つ前に戻す】曲一覧の右上に ↩ ボタンを追加した。

    竹弘の狙い:
        「並び替え誤操作による1回戻しが重要。ソートの戻しはおまけ程度」

    主な出番はドラッグ中に指が滑って曲順が変わってしまった時。慌てて
    手で戻さなくても、↩ を1回押せば元通りになる。

    ・js/undo.js を新設
    ・対象はドラッグ並び替えとソートメニューの両方(竹弘の指示)
    ・**戻せるのは1回だけ**。戻した後はボタンが薄くなり、次に曲順を
      変えるまで押せない(竹弘の指示で2つ前以上には遡れない仕様。
      何度も行き来できるより1回で完結する方が意味が明確なため)
    ・一つ前の曲順は playlists の previous_track_id_list にも保存する。
      うっかり並び替えたままアプリを閉じても次回起動時に戻せる
    ・ボタンは各行の並び替えボタン(↕)の真上に配置(竹弘の指定)。
      並び替えを操作した指のすぐ近くにあるのが自然という考えによる
    ・押せない時も隠さず薄く残している。位置が動かず場所を覚えやすいため

    あわせて、曲順をDBへ保存する処理を js/undo.js の savePlaylistOrder()
    に一本化した。以前は js/sort.js と js/drag-sort.js が同じ内容を
    別々に持っており、片方だけ直して食い違う事故が起きうる状態だった。

======================================================================
-->
<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

    <!-- PWA設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">

    <!-- ブラウザタイトル -->
    <title>

        (v86)ノリRun
        メインメニュー

    </title>

    <style>

        /* ======================================================
           NoriRun 共通デザイン(c013と同じ配色・カード style)
        ====================================================== */

        :root{
            --main-blue:#007aff;
            --bg-color:#f2f2f7;
            --card-bg:#ffffff;
            --text-main:#1c1c1e;
            --text-sub:#8e8e93;
            --border-color:#d1d1d6;
        }

        html,
        body{
            margin:0;
            padding:0;
            width:100%;

            /*
            【固定1画面レイアウトの土台 その1】

            以前は min-height:100%(中身が増えたら下に伸びる)でしたが、
            この画面は「スマホの1画面に必ず収まり、ページ全体は
            絶対にスクロールしない」方針に変更しました。

            そのため、高さを画面ぴったりに固定(height:100%)し、
            はみ出した分は表示しない(overflow:hidden)ようにします。

            こうしておかないと、曲一覧が増えたときにページ全体が
            伸びてしまい、上に置いた操作ボタンが画面外へ
            追い出されて押せなくなります。
            */
            height:100%;
            overflow:hidden;

            /*
            overscroll-behavior:none は、
            「一番下まで来た状態でさらに指を下に引っ張った時、
              ページ全体がゴムのように動く(バウンスする)動き」
            を止める指定です。

            走りながら操作するアプリなので、
            画面がぐらつかないように固定します。
            */
            overscroll-behavior:none;

            background:var(--bg-color);
            color:var(--text-main);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                sans-serif;

            /*
            並び替え操作中に文字が選択されてしまうと
            誤動作の原因になるため、選択を禁止します。
            */
            -webkit-user-select:none;
            user-select:none;
        }

        /*
        【固定1画面レイアウトの土台 その2】

        #app を「画面の高さそのもの」にして、
        中身を縦2段(上半分=操作エリア / 下半分=曲一覧)に分けます。

        ・display:flex + flex-direction:column
            → 子要素を縦に積み上げる並べ方です。
              この指定があると、子要素側で「残りの高さを全部使う」
              といった高さの配分ができるようになります。

        ・height:100dvh の "dvh" とは
            → dynamic viewport height(動的な画面の高さ)の略。
              スマホのブラウザは、スクロールするとアドレスバーが
              引っ込んで表示領域が変わります。
              昔からある 100vh はアドレスバーが出ている状態を
              考慮しないため、画面下がわずかに隠れてしまいます。
              100dvh は「今まさに見えている高さ」に追従します。

              ただし古いブラウザは dvh を知らないので、
              先に 100vh を書いておき、
              dvh を理解できるブラウザだけが後の行で上書きします
              (CSSは同じ指定が2つ並ぶと、後の行が勝つルール)。
        */
        #app{
            max-width:480px;
            margin:0 auto;
            padding:10px;
            box-sizing:border-box;

            height:100vh;
            height:100dvh;

            display:flex;
            flex-direction:column;
            gap:8px;
        }

        .card{
            background:var(--card-bg);
            border-radius:18px;
            padding:20px;
            box-shadow:0 6px 16px rgba(0,0,0,0.08);
        }

        /* ======================================================
           上半分：操作エリア(今後ボタンを追加していく場所)
        ====================================================== */
        /*
        flex:1 1 50% は3つの値をまとめた書き方で、意味は
            flex-grow:1    … 余白があれば伸びる
            flex-shrink:1  … 足りなければ縮む
            flex-basis:50% … 基本の高さは親(=画面)の50%
        です。

        上半分と下半分に同じ指定をすることで、
        画面をきっちり半分ずつに分け合います。

        min-height:0 は、flexboxの有名な落とし穴への対策です。
        flexの子要素は初期状態だと「中身より小さくならない」ため、
        曲が増えると勝手に高さが膨らんで画面からはみ出します。
        min-height:0 を書くと、この制限が外れて
        「指定した50%を守り、中身は内側でスクロールする」
        という本来やりたい動きになります。
        */
        #upper-area{
            flex:1 1 50%;
            min-height:0;

            display:flex;
            flex-direction:column;
            gap:8px;
            overflow:hidden;
        }

        /*
        タイトル部分。中身が固定なので縮ませません(flex-shrink:0)。

        position:relative を付けているのは、この中の右上に
        解析状況ランプ(#ofs-lamp)を絶対配置するための基準にするためです。
        */
        .header-card{
            flex-shrink:0;
            padding:10px 16px;
            position:relative;
        }

        /* ======================================================
           解析状況ランプ(OFS Ver1.1より移植)

           曲データの解析が裏で進んでいることを、画面右上の
           小さなランプで知らせます。3段階で色と文言が変わり、
           全部終わると5秒後にフワッと消えます。
        ====================================================== */

        #ofs-lamp{
            position:absolute;
            top:8px;
            right:8px;

            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:6px;

            /*
            元のOFSは width:145px の固定幅でしたが、
            解析の進捗(3/50 など)も出すようにしたため、
            最低幅だけ確保して横に伸びられるようにしています。
            右上を基準に配置しているので、幅が伸びても
            ランプのアイコン位置は右端で動きません。
            */
            min-width:145px;
            width:auto;

            padding:4px 8px;
            border-radius:6px;
            font-size:0.72rem;
            font-weight:bold;
            box-sizing:border-box;

            /* フェーズ3完了時に、フワッと消えるためのアニメ設定 */
            transition:opacity 0.5s ease;

            /* ランプの下にある文字をタップできるよう、当たり判定を無効化 */
            pointer-events:none;
            z-index:10;
        }

        /* フェーズ1用:速い点滅(0.25秒サイクル) */
        @keyframes blink-fast{
            0%,100%{opacity:1;}
            50%{opacity:0.1;}
        }
        .blink-fast{
            animation:blink-fast 0.25s infinite;
        }

        /* フェーズ2用:普通のテンポの点滅(0.8秒サイクル) */
        @keyframes blink-normal{
            0%,100%{opacity:1;}
            50%{opacity:0.2;}
        }
        .blink-normal{
            animation:blink-normal 0.8s infinite;
        }

        h1{
            margin:0 0 2px;
            text-align:center;
            font-size:1.3rem;
        }

        .sub-title{
            margin:0;
            text-align:center;
            color:var(--text-sub);
            font-size:0.85rem;
        }

        /*
        今後ボタンを置く予定の空きエリア。
        上半分の「余り」を全部受け持ちます(flex:1)。
        再生エリアが表示された時は、その分だけここが縮みます。
        */
        #future-area{
            flex:1;
            min-height:0;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
        }

        .future-note{
            margin:0;
            text-align:center;
            color:var(--text-sub);
            font-size:0.8rem;
            line-height:1.7;
        }

        /* ======================================================
           下半分：曲一覧エリア
        ====================================================== */

        #list-area{
            flex:1 1 50%;
            min-height:0;

            display:flex;
            flex-direction:column;
            padding:12px 12px 10px;
            overflow:hidden;

            /*
            並び替えメニュー(#sort-menu)を浮かせる時の位置の基準に
            なります(v81)。これが無いと、メニューが画面全体を基準に
            置かれてしまい、狙った場所に出せません。
            */
            position:relative;
        }

        .section-title{
            margin:0 0 8px;
            font-size:1.05rem;
            flex-shrink:0;

            /*
            「曲一覧」の文字の横に並び替えボタンを置くため、
            横並びにしています(v81)。
            gap は文字とボタンの間隔です。
            */
            display:flex;
            align-items:center;
            gap:8px;
        }

        /* ======================================================
           丸ボタン(並び替えメニューを開く等)

           竹弘の要望「ボタンアイコンの判定は四角で
           アイコンデザインは丸(〇)」に沿った作りです。

           border-radius:50% で見た目だけ丸くしていますが、
           要素そのものは四角のままなので、指の当たり判定は
           四角い範囲すべてになります。角の部分を押しても
           反応するので、小さくても押しやすくなります。
        ====================================================== */
        .round-btn{
            display:flex;
            align-items:center;
            justify-content:center;

            /*
            丸の大きさ(v86で 32px → 40px に拡大)。

            中の記号(⇅ や ↩)が小さくて見えにくいという竹弘の指摘に
            よるもの。まず文字を大きくし、それでも足りない場合は丸を
            1.25倍に、という段取りだったので、32×1.25=40px にしている。
            */
            width:40px;
            height:40px;
            padding:0;

            border:1px solid var(--border-color);
            border-radius:50%;
            background:#ffffff;

            /*
            記号の大きさ(v86で 0.95rem → 1.5rem に拡大)。

            1.5rem は約24px。丸の内側(40px から枠線を引いて38px)に
            対して6割ほどの大きさで、はみ出さずにできるだけ大きく
            見せられる値。太字にして、走りながらでも見分けやすくしている。

            line-height:1 は「文字の行の高さを文字そのものと同じにする」
            指定。これが無いと文字の上下に余白が入り、丸の中で
            中心からずれて見えてしまう。
            */
            font-size:1.5rem;
            font-weight:bold;
            line-height:1;

            cursor:pointer;
            box-sizing:border-box;

            /* 曲名が長くてもボタンが潰れないようにします */
            flex-shrink:0;
        }

        .round-btn:active{
            background:#e5e5ea;
        }

        /*
        押せない状態のボタン(v85)。

        戻せる曲順が無い時、↩ ボタンをこの見た目にします。
        隠さずに薄く残しているのは、ボタンの位置が動かず
        「いつもここにある」と覚えられるためです。

        opacity は透明度で、0.35 は「35%だけ見える」= かなり薄い状態。
        */
        .round-btn:disabled{
            opacity:0.35;
            cursor:default;
        }

        /*
        戻す(↩)ボタンは、曲一覧エリアの右端に置きます(v85)。

        margin-left:auto は「左側の余白を目一杯とる」指定で、
        結果としてこのボタンだけが右端へ押し出されます。

        竹弘の指定により、各行の並び替えボタン(↕)のちょうど真上に
        なる位置です。並び替えの誤操作を戻す機能なので、操作した指の
        すぐ近くにあるのが自然、という考えによるものです。
        */
        .undo-btn{
            margin-left:auto;
        }

        /* 並び替えメニューを開いている間は、ボタンの色を変えます */
        .round-btn.open{
            background:var(--main-blue);
            border-color:var(--main-blue);
            color:#ffffff;
        }

        /* ======================================================
           並び替えメニュー(v81)

           ブラウザ標準の <select>(ピッカー)ではなく、
           自分でHTMLとCSSを組んだメニューです。

           理由は、🕺🆕🔤🎤⏱ の記号を狙った位置に置きたいことと、
           今どの順番で並んでいるかを ▲▼ で示したいため。
           <select> は端末ごとに見た目が変わり、こうした装飾が
           できません(竹弘への説明のとおり)。

           position:absolute で「曲一覧エリアの中の、見出しのすぐ下」に
           浮かせています。基準になるのは #list-area(position:relative)です。
        ====================================================== */
        #sort-menu{
            /*
            画面を基準に位置を決めます(v86で absolute から変更)。

            【なぜ変えたか】
            以前は曲一覧エリアの中に浮かせていましたが、このエリアは
            はみ出した部分を隠す設定(overflow:hidden)のため、記号を
            大きくしてメニューが縦に伸びると、画面の小さい端末で
            下の項目が切れてしまう計算になりました。

            position:fixed にすると画面そのものが基準になり、
            エリアの外にも自由に出せます。実際の表示位置(top/left)は
            ボタンの位置を測って js/sort.js が設定します。
            画面の下に収まらない時は、ボタンの上側に出す作りです。
            */
            position:fixed;
            z-index:1000;

            background:#ffffff;
            border:1px solid var(--border-color);
            border-radius:12px;
            box-shadow:0 8px 24px rgba(0,0,0,0.18);

            /* 角を丸くした内側からはみ出さないようにします */
            overflow:hidden;

            min-width:210px;
        }

        .sort-menu-item{
            display:flex;
            align-items:center;
            gap:10px;

            width:100%;

            /*
            上下の余白(v86で 13px → 11px に調整)。
            記号を大きくした分、行が高くなりすぎないよう少し詰めている。
            メニュー全体が縦に伸びすぎると、曲一覧エリアからはみ出して
            下の項目が隠れてしまうため。
            */
            padding:11px 14px;

            border:none;
            border-bottom:1px solid #f0f0f0;
            background:transparent;

            font-size:0.95rem;
            color:var(--text-main);
            text-align:left;
            cursor:pointer;
            box-sizing:border-box;
        }

        /* 一番下の項目にだけ区切り線を引かない */
        .sort-menu-item:last-child{
            border-bottom:none;
        }

        .sort-menu-item:active{
            background:#e5e5ea;
        }

        /* 今その順番で並んでいる項目は、青くして目立たせます */
        .sort-menu-item.active{
            color:var(--main-blue);
            font-weight:bold;
        }

        /*
        メニューの1文字目にある記号(🕺🆕🔤🎤⏱)(v86で追加)。

        小さくて見分けにくいという竹弘の指摘により、文字だけを
        大きくしています。行の高さにはまだ余裕があるため、
        項目名の文字はそのままで記号だけを拡大しました。

        width で幅を決めているのは、記号ごとに横幅が違っても
        項目名の始まる位置が揃うようにするためです。
        (揃えないと「ノリ注入順」と「登録日時順」の頭がずれて
          きれいに見えません)
        */
        .sort-icon{
            font-size:1.5rem;
            line-height:1;
            width:1.7rem;
            text-align:center;
            flex-shrink:0;
        }

        /*
        ▲▼を右端に寄せます。
        margin-left:auto は「左側の余白を目一杯とる」という指定で、
        結果としてこの要素が右端へ押し出されます。
        */
        .sort-arrow{
            margin-left:auto;
            font-size:0.75rem;
        }

        /*
        リストの「窓枠」です。
        自分自身はスクロールせず、位置の基準になるだけの箱です。

        position:relative を指定しておくと、
        この中に置いた position:absolute の要素(上下の光る演出)が
        「画面全体」ではなく「この窓枠」を基準に配置されます。
        こうすることで、光る演出が曲一覧エリアの中に収まります。
        */
        #list-viewport{
            position:relative;
            flex:1;
            min-height:0;
        }

        /* ======================================================
           曲一覧(OFS: On-Demand Floating Sort より移植)
        ====================================================== */

        /*
        実際に曲の行が並び、指でスクロールする本体です。

        overflow-y:auto
            → 中身が窓枠より多い時だけ、この要素の中で縦スクロールします。
              ページ全体ではなく「ここだけ」が動くのがポイントです。

        overscroll-behavior:contain
            → リストの端まで来た後もさらにスクロールしようとした時、
              その動きを親(ページ全体)に伝えない指定です。
              「スクロールの連鎖」を断ち切り、画面がずれるのを防ぎます。

        -webkit-overflow-scrolling:touch
            → 指を離した後もスーッと滑る、慣性スクロールを有効にします。
        */
        .music-list{
            height:100%;
            overflow-y:auto;
            overscroll-behavior:contain;
            -webkit-overflow-scrolling:touch;

            display:flex;
            flex-direction:column;
            gap:8px;
            position:relative;

            /* 行の影がスクロールバーで切れないよう、右に少し余白を取ります */
            padding-right:2px;
        }

        /* 通常時：縦スワイプ(スクロール)を100%許可します */
        .music-row{
            display:flex;
            align-items:center;
            background:#f8f8f8;
            border-radius:12px;
            padding:6px;
            box-sizing:border-box;
            border:1px solid var(--border-color);
            height:56px;
            touch-action:pan-y;
            transition:background-color 0.15s ease;

            /*
            flex-shrink:0 は「縮まない」という宣言です。

            曲一覧が高さ固定のエリア内スクロールになったため、
            この指定が無いと、曲数が多い時に flexbox が
            1行1行を潰して無理やり詰め込もうとし、
            行がぺしゃんこになってしまいます。
            */
            flex-shrink:0;
        }

        .square-btn{
            display:flex;
            align-items:center;
            justify-content:center;
            background:#ffffff;
            border:1px solid var(--border-color);
            border-radius:10px;
            cursor:pointer;
            box-sizing:border-box;
            flex-shrink:0;
            width:44px;
            height:44px;
            font-size:1.2rem;
        }

        /* ノリ注入ボタン(🛌/🕺)を押した瞬間の色 */
        .norinori-btn:active{
            background:#e5e5ea;
        }

        /* 右端の並び替えボタンだけ、スクロール操作を完全ブロックします */
        .sort-handle{
            color:#b1b1b6;
            background:#ffffff;
            cursor:grab;
            touch-action:none;
        }

        .sort-handle.active-blue{
            color:#00a2ff !important;
            border-color:#00a2ff !important;
            background:#e6f6ff;
        }

        /* 空中浮遊モード(ドラッグ中の行) */
        .music-row.dragging{
            position:fixed;
            box-shadow:0 15px 35px rgba(0,162,255,0.35);
            background:#ffffff;
            border-color:#00a2ff;
            z-index:10000;
            opacity:0.95;
            transform:scale(1.02);
            pointer-events:none;
            transition:none !important;
        }

        /* 差し込みスロット(指を離した時の着地位置) */
        .drag-placeholder{
            height:56px;
            background:rgba(0,162,255,0.03);
            border:2px dashed #00a2ff;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,162,255,0.2);
            box-sizing:border-box;
            transition:transform 0.2s ease;

            /* 曲の行と同じ理由で、こちらも潰れないようにします */
            flex-shrink:0;
        }

        /* ======================================================
           曲情報エリア(2行構成)

           竹弘の指示による1行の割り当て:

             [ノリ注ボタン:1] [ 曲情報エリア:残り全部 ] [並び替え:1]
                                    ↑
                          1行目 … タイトル
                          2行目 … 曲の長さ + 空白 + アーティスト名
                          右端  … ジャケット画像(取得できた時だけ)
        ====================================================== */

        /*
        以前は .title-area(flex:3)と .artist-area(flex:2)で
        横に2分割していましたが、曲の長さとジャケット画像が加わったため、
        「1つのエリアの中を2行に分ける」構成へ変更しました。
        */
        .info-area{
            flex:1;
            min-width:0;
            display:flex;
            align-items:center;
            padding:0 8px;
            overflow:hidden;
            gap:6px;
        }

        /*
        テキスト2行を縦に積むブロックです。
        min-width:0 は、長い曲名が入った時に
        このブロックが横に膨らんでジャケット画像を
        押し出してしまうのを防ぐための指定です
        (flexアイテムは既定で「中身より狭くならない」ため)。
        */
        .text-block{
            flex:1;
            min-width:0;
            overflow:hidden;
        }

        /* 1行目・2行目。どちらも1行に収め、はみ出しは隠します */
        .info-line{
            overflow:hidden;
            white-space:nowrap;
        }

        .scroll-text{
            display:inline-block;
            font-size:0.95rem;
            font-weight:600;
            color:var(--text-main);
            pointer-events:none;
        }

        .artist-text{
            display:inline-block;
            font-size:0.75rem;
            color:var(--text-sub);
            pointer-events:none;
        }

        /*
        曲の長さの表示部分。

        font-variant-numeric:tabular-nums は、数字の文字幅を
        すべて同じに揃える指定です(表計算ソフトの数字と同じ考え方)。
        これが無いと「1」と「8」で幅が変わり、曲ごとに
        アーティスト名の開始位置がガタガタずれて見えます。
        */
        .duration-text{
            font-variant-numeric:tabular-nums;
        }

        /*
        ジャケット画像。竹弘の指示通り「割合1」=ボタンと同じ44px角で、
        並び替えボタンの左隣(=曲情報エリアの右端)に配置します。

        margin-left:auto は「左側の余白を可能な限り広げる」という意味で、
        結果としてこの画像だけが右端へ押し出されます
        (flexboxで右寄せしたい時の定番の書き方)。
        */
        .jacket-img{
            width:44px;
            height:44px;
            border-radius:6px;
            object-fit:cover;
            margin-left:auto;
            flex-shrink:0;
            background:#e5e5ea;
        }

        /* 長いタイトルをタップした時に横スクロールで見せる演出 */
        @keyframes marquee-pattern-b{
            0%{transform:translateX(0);}
            75%{transform:translateX(var(--scroll-x));opacity:1;}
            80%{transform:translateX(var(--scroll-x));opacity:0;}
            81%{transform:translateX(30px);opacity:0;}
            100%{transform:translateX(0);opacity:1;}
        }
        .scroll-active{
            animation:marquee-pattern-b var(--scroll-duration) linear 1;
        }

        /*
        曲一覧エリアの上下端が光って、
        自動スクロール中であることを知らせます。

        以前は position:fixed(画面全体の上下端)でしたが、
        曲一覧が画面下半分のエリア内スクロールに変わったため、
        position:absolute にして #list-viewport(窓枠)の
        上下端で光るように変更しました。

        z-index も 10000 から 5 に下げています。
        ドラッグ中の浮遊行(z-index:10000)より下に置くことで、
        光の帯が曲の行を隠してしまわないようにするためです。
        */
        .glow-indicator{
            position:absolute;
            left:0;
            width:100%;
            height:26px;
            pointer-events:none;
            z-index:5;
            opacity:0;
            transition:opacity 0.3s ease;
            border-radius:10px;
        }
        .glow-top{
            top:0;
            background:linear-gradient(to bottom,rgba(0,162,255,0.35),transparent);
        }
        .glow-bottom{
            bottom:0;
            background:linear-gradient(to top,rgba(0,162,255,0.35),transparent);
        }
        .glow-active{
            opacity:1;
        }

        .empty-message{
            color:var(--text-sub);
            font-size:0.95rem;
            line-height:1.6;
            text-align:center;
            padding:20px 6px;
        }

        /* ======================================================
           再生エリア
        ====================================================== */

        /*
        再生エリア。曲を再生した時だけ表示します。
        flex-shrink:0 で、表示された時は必ずこの高さを確保します
        (代わりに #future-area の空きエリアが縮みます)。
        */
        #player-box{
            display:none;
            flex-shrink:0;
            padding:10px 14px;
        }

        /*
        曲名が長い時、以前は word-break:break-all で折り返していましたが、
        固定1画面レイアウトでは何行にも増えると上半分を圧迫するため、
        1行に収めて、はみ出した分は「…」で省略する形に変更しました。

        white-space:nowrap  … 改行しない
        overflow:hidden     … はみ出した分は表示しない
        text-overflow:ellipsis … 隠れた部分を「…」で示す
        (この3つはセットで使うのがお約束です)
        */
        #now-playing{
            margin:0 0 6px;
            font-size:0.85rem;
            font-weight:bold;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        audio{
            width:100%;
            height:40px;
        }

    </style>

    <!--
    ================================================================

</head>
<body>

<!--
================================================================
 初期設定画面(起動時に1回だけ通る)

   #init-screen         … マイ・ピッチ設定(定規をスワイプ)

<div id="setup-screen" style="display:none;">

<!--

<style>
    #debug-log-panel{
        position:fixed; left:0; right:0; bottom:0;
        height:30vh;
        background:rgba(0,0,0,0.85);
        color:#0f0;
        font-family:monospace;
        font-size:0.75rem;
        z-index:20000;
        display:flex;
        flex-direction:column;
    }
    #debug-log-header{
        display:flex; justify-content:space-between; align-items:center;
        padding:6px 10px;
        background:rgba(255,255,255,0.1);
        color:#fff;
    }
    #debug-log-clear,
    #debug-log-toggle{
        width:auto; margin-top:0; padding:4px 12px; font-size:0.75rem;
    }
    #debug-log-body{
        flex:1; overflow-y:auto; padding:6px 10px;
        white-space:pre-wrap; word-break:break-all;
    }

    /*
    【最小化した状態】
    このパネルは画面下30%を占領するため、
    「固定1画面レイアウトが本当に収まっているか」を
    実機で確認する邪魔になります。

    そこで、小さなつまみだけを残して
    たためるようにしました(つまみをタップで開閉)。
    起動時は最小化した状態から始まります。

    最小化した時の置き場所を「左上」にしているのには理由があります。

    ・右下 … 曲一覧の一番下の行の並び替えボタンに重なり、掴めなくなる
    ・左下 … 一番下の行の再生ボタンに重なる
    ・右上 … 解析状況ランプ(#ofs-lamp)と衝突する
    ・左上 … タイトル「ノリRun」は中央寄せなので、ここだけ何も無い ← 採用

    */
    #debug-log-panel.minimized{
        right:auto; left:6px;
        bottom:auto; top:6px;
        width:auto; height:auto;
        border-radius:20px;
        opacity:0.7;
    }
    #debug-log-panel.minimized #debug-log-body,
    #debug-log-panel.minimized #debug-log-clear{
        display:none;
    }
    #debug-log-panel.minimized #debug-log-header{
        background:transparent;
        padding:2px 6px;
        gap:4px;
    }
</style>
<div id="debug-log-panel">
    <div id="debug-log-header">
        <span id="debug-log-title">開発用デバッグログ</span>
        <span>
            <button id="debug-log-clear">クリア</button>
            <button id="debug-log-toggle">▲</button>
        </span>
    </div>
    <div id="debug-log-body"></div>
</div>
<script>
(function(){
    const logBody = document.getElementById("debug-log-body");

    function formatArgs(args){
        return Array.prototype.map.call(args,function(value){
            if(value instanceof Error){
                // ErrorはJSON.stringifyだと空({})に見えるため、
                // name(種類)とmessage(内容)を直接表示します。
                return value.name + ": " + value.message;
            }
            if(typeof value === "object" && value !== null){
                try{ return JSON.stringify(value); }
                catch(e){ return String(value); }
            }
            return String(value);
        }).join(" ");
    }

    function appendLine(text,isError){
        const line = document.createElement("div");
        if(isError){ line.style.color = "#ff453a"; }
        line.textContent = text;
        logBody.appendChild(line);
        logBody.scrollTop = logBody.scrollHeight;
    }

    const originalConsoleLog = console.log;
    console.log = function(){
        originalConsoleLog.apply(console,arguments);
        appendLine(formatArgs(arguments),false);
    };

    const originalConsoleError = console.error;
    console.error = function(){
        originalConsoleError.apply(console,arguments);
        appendLine("[ERROR] " + formatArgs(arguments),true);
    };

    document.getElementById("debug-log-clear").onclick = function(){
        logBody.innerHTML = "";
    };

    // ---- パネルの開閉(最小化)処理 ----
    const panel     = document.getElementById("debug-log-panel");
    const toggleBtn = document.getElementById("debug-log-toggle");
    const titleEl   = document.getElementById("debug-log-title");

    function setMinimized(minimized){
        if(minimized){
            panel.classList.add("minimized");
            toggleBtn.textContent = "▲";
            titleEl.textContent   = "🐛";
        }
        else{
            panel.classList.remove("minimized");
            toggleBtn.textContent = "▼";
            titleEl.textContent   = "開発用デバッグログ";
        }
    }

    toggleBtn.onclick = function(){
        setMinimized(!panel.classList.contains("minimized"));
    };

    // 起動時は最小化。ログを見たい時だけ右下の🐛をタップして開きます。
    setMinimized(true);
})();
</script>

================================================================
 JavaScript本体(js/ フォルダのファイルを順番に読み込みます)

 【なぜファイルを分けているのか】

 以前はこの位置に約1,900行のJavaScriptを直接書いていました。
 しかしc014.htmlが1ファイルで3,000行近くまで育ち、この先
 ビートマッチング(音声処理)を足すと手に負えなくなるため、
 機能ごとに js/ フォルダのファイルへ分けました。

 効果はもう一つあります。竹弘はGitHubへ手動でファイルを
 アップロードしているため、以前は1文字直すたびに100KB超の
 c014.htmlを丸ごと上げ直す必要がありました。今後は
 「直したファイルだけ」を上げれば済みます。

 【読み込む順番には意味がある(勝手に入れ替えないこと)】

   config    … 他の全ファイルが使う定数・画面部品・共有状態
   db        … IndexedDBの読み書き
   setup     … 初期設定(マイ・ピッチ設定・Musicフォルダ登録)
   scanner   … Musicフォルダのスキャンと、新しい曲の登録
   nori      … ノリ注入ボタン(🛌 → 🕺)
   sort      … 曲一覧の並び替え(メニューと並び順の判定)
   undo      … 曲順を一つ前に戻す(↩ボタン)
   list-view … 曲一覧の描画
   player    … 曲の再生
   drag-sort … 並び替え(OFS)
   lamp      … 解析状況ランプの表示
   metadata  … メタデータ解析エンジン
   main      … 起動処理(最後に startUp() を呼ぶ)

 config が先頭なのは、他の全ファイルがここの値を使うためです。
 main が最後なのは、他の全ファイルの関数を使うためです。
 この2つの位置だけは動かさないでください。

 また、この<script>群が </body> の直前にあるのも重要です。
 config.js は起動時に document.getElementById() で画面部品を
 取得するため、HTMLが組み上がった後でないと動きません。

 【なぜ type="module" を付けないのか】

 ES Modules(import/export)ではなく、昔ながらの<script>を
 順番に並べる方式にしています。こうするとファイルを分けても
 変数の見え方(スコープ)が1ファイルだった頃と全く同じなので、
 分割によって動作が変わる心配がありません。
 詳しい理由は js/config.js の冒頭に書いてあります。

 【新しいファイルを追加する時は】

 sw.js の ASSETS にも必ず追加すること。忘れると、その
 ファイルだけオフラインで読み込めなくなります。
 (v70で実際にこの登録漏れの事故を起こしています)
================================================================
