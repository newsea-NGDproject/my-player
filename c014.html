<!--
======================================================================
 c014(メインメニュー・曲一覧・再生・並び替え)

 NoriRun Phase2

 【画面名】
 メインメニュー

----------------------------------------------------------------------

【この画面の役割】

① c013までに登録したmusic_libraryの曲を一覧表示する

② 曲をタップして再生する

③ 曲順をドラッグ&ドロップで並び替え、playlistsへ保存する

----------------------------------------------------------------------

【このSTEPで実装する内容】

STEP01
    曲一覧表示(music_libraryから取得)

STEP02
    再生ボタンで曲を再生する

STEP03
    並び替え(OFS: On-Demand Floating Sort)を移植し、
    playlistsへ並び順を保存する

----------------------------------------------------------------------

【使用するIndexedDB】

music_library(読み取りのみ)
playlists(読み書き、main_menu_defaultキー)

----------------------------------------------------------------------

【今回は範囲外の機能】

・タップ補正(ノリノリ設定)は別モジュールのため、今回は再生ボタンに置き換える
・ビートマッチング(設定BPMに合わせた再生・接続)は未実装。
  今回は曲を普通の速さで再生するだけ

----------------------------------------------------------------------

【並び替えエンジンについて】

legacy/ver8.5-gemini の「OFS(On-Demand Floating Sort)」モジュールを
移植したもの。ただし、OFSは元々 music_library の file_path をキーに
していたが、現行スキーマ(docs/db-schema.md)は track_id が主キーのため、
track_id 基準に置き換えている。playlistsストアの保存フィールドも
file_path_list ではなく track_id_list(現行スキーマ通り)を使用する。

----------------------------------------------------------------------

【更新履歴】

2026-08-03
    新規作成。曲一覧表示・再生・OFS移植による並び替えを実装(v66)

    (v67)
    再生失敗時のエラーメッセージを、権限切れとコーデック非対応(play()の
    失敗、およびaudio要素のonerror)で区別できるよう修正。
    デバッグログパネルがError/DOMExceptionの中身({}に見えてしまう問題)
    を正しく表示できるよう修正

======================================================================
-->

<script>
(function(){
    const logBody = document.getElementById("debug-log-body");

    function formatArgs(args){
        return Array.prototype.map.call(args,function(value){
            if(value instanceof Error){
                // ErrorはJSON.stringifyだと空({})に見えるため、
                // name(種類)とmessage(内容)を直接表示します。
                return value.name + ": " + value.message;
            }
            if(typeof value === "object" && value !== null){
                try{ return JSON.stringify(value); }
                catch(e){ return String(value); }
            }
            return String(value);
        }).join(" ");
    }

    function appendLine(text,isError){
        const line = document.createElement("div");
        if(isError){ line.style.color = "#ff453a"; }
        line.textContent = text;
        logBody.appendChild(line);
        logBody.scrollTop = logBody.scrollHeight;
    }

    const originalConsoleLog = console.log;
    console.log = function(){
        originalConsoleLog.apply(console,arguments);
        appendLine(formatArgs(arguments),false);
    };

    const originalConsoleError = console.error;
    console.error = function(){
        originalConsoleError.apply(console,arguments);
        appendLine("[ERROR] " + formatArgs(arguments),true);
    };

    document.getElementById("debug-log-clear").onclick = function(){
        logBody.innerHTML = "";
    };
})();
</script>

<script>

/* ==========================================================
   JavaScript

   c013と同じく
   「画面」「DB」「フォルダ」「曲情報」
   の順番でプログラムを並べます。
========================================================== */

// ==========================================================
// 0. 定数定義
// ==========================================================

const DB_NAME = "NoriRunDB";
const DB_VERSION = 1;

const STORE_SETTINGS = "settings";
const STORE_MUSIC = "music_library";
const STORE_PLAYLISTS = "playlists";
const STORE_FOLDER_ROOTS = "folder_roots";

// メインメニューの並び順を保存する、playlistsストアの固定キーです。
const MAIN_MENU_PLAYLIST_ID = "main_menu_default";

// 画面部品を取得しておきます。
const menuListEl = document.getElementById("menu-list");
const audioPlayer = document.getElementById("audio-player");
const playerBox = document.getElementById("player-box");
const nowPlayingEl = document.getElementById("now-playing");

// 再生中の一時URL(曲を切り替える時に解放するため覚えておきます)
let currentObjectUrl = null;

// 現在の曲順(track_idの配列)
let currentOrderList = [];

// track_id をキーにした曲データの早見表
let libraryMap = {};

// ドラッグ&ドロップ操作用の状態(OFSより移植)
let draggingRow = null;
let placeholder = null;
let startOffsetY = 0;
let currentClientY = 0;
let autoScrollActive = false;


// ==========================================================
// 1. IndexedDBを開く・共通関数(c013と同じ内容)
// ==========================================================

function openNoriRunDB(){

    return new Promise(function(resolve,reject){

        const request = indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded = function(event){
            console.log("NoriRunDB 新規作成");
        };

        request.onsuccess = function(event){
            resolve(event.target.result);
        };

        request.onerror = function(){
            reject("NoriRunDBを開けませんでした。");
        };

    });

}

function idbGet(storeName,key){

    return new Promise(async function(resolve,reject){

        try{
            const db = await openNoriRunDB();
            const tx = db.transaction(storeName,"readonly");
            const store = tx.objectStore(storeName);
            const request = store.get(key);

            request.onsuccess = function(){
                db.close();
                resolve(request.result);
            };

            request.onerror = function(){
                db.close();
                reject("データ取得失敗");
            };

        }
        catch(error){
            reject(error);
        }

    });

}

function idbPut(storeName,value,key){

    return new Promise(async function(resolve,reject){

        try{
            const db = await openNoriRunDB();
            const tx = db.transaction(storeName,"readwrite");
            const store = tx.objectStore(storeName);

            if(key === undefined){
                store.put(value);
            }
            else{
                store.put(value,key);
            }

            tx.oncomplete = function(){
                db.close();
                resolve();
            };

            tx.onerror = function(){
                db.close();
                reject("保存失敗");
            };

        }
        catch(error){
            reject(error);
        }

    });

}

function idbGetAll(storeName){

    return new Promise(async function(resolve,reject){

        try{
            const db = await openNoriRunDB();
            const tx = db.transaction(storeName,"readonly");
            const store = tx.objectStore(storeName);
            const request = store.getAll();

            request.onsuccess = function(){
                db.close();
                resolve(request.result || []);
            };

            request.onerror = function(){
                db.close();
                reject("全件取得失敗");
            };

        }
        catch(error){
            reject(error);
        }

    });

}


// ==========================================================
// 2. 曲一覧の読み込み
// ==========================================================
/**
 * music_libraryの全曲と、playlistsに保存済みの並び順を読み込みます。
 *
 * 並び順がまだ保存されていない場合は、
 * music_libraryから取得した順番をそのまま使います。
 *
 * 並び順は保存されているが、その後に新しく登録された曲がある場合は、
 * 保存されていた並び順の「後ろ」に追加します。
 *
 * 逆に、並び順には載っているが、
 * すでにmusic_libraryから消えた曲(track_id)があれば、
 * 一覧から除外します。
 */
async function loadMenuData(){

    const allTracks = await idbGetAll(STORE_MUSIC);

    libraryMap = {};
    allTracks.forEach(function(track){
        libraryMap[track.track_id] = track;
    });

    const playlistData = await idbGet(STORE_PLAYLISTS,MAIN_MENU_PLAYLIST_ID);

    if(playlistData && playlistData.track_id_list && playlistData.track_id_list.length > 0){

        // 保存済みの並び順のうち、今も存在する曲だけを残します。
        currentOrderList = playlistData.track_id_list.filter(function(trackId){
            return libraryMap[trackId] !== undefined;
        });

        // 並び順にまだ載っていない、新しく登録された曲を後ろに追加します。
        allTracks.forEach(function(track){
            if(currentOrderList.indexOf(track.track_id) === -1){
                currentOrderList.push(track.track_id);
            }
        });

    }
    else{

        // 並び順が未保存の場合は、登録されている順番をそのまま使います。
        currentOrderList = allTracks.map(function(track){
            return track.track_id;
        });

    }

    console.log("曲一覧読み込み件数 :",currentOrderList.length);

    renderList();

}


// ==========================================================
// 3. 曲一覧の描画(OFSより移植、track_id基準に変更)
// ==========================================================

function renderList(){

    menuListEl.innerHTML = "";

    if(currentOrderList.length === 0){
        menuListEl.innerHTML =
            "<div class='empty-message'>まだ曲が登録されていません。<br>" +
            "c013の「Musicフォルダ確認」から曲を登録してください。</div>";
        return;
    }

    currentOrderList.forEach(function(trackId){

        const track = libraryMap[trackId];
        if(!track){ return; }

        const displayTitle = track.title || track.file_name;
        const displayArtist = track.artist || "";

        const row = document.createElement("div");
        row.className = "music-row";
        row.dataset.trackId = trackId;

        row.innerHTML =
            "<button class='square-btn play-btn'>▶️</button>" +
            "<div class='title-area'>" +
                "<span class='scroll-text'>" + escapeHtml(displayTitle) + "</span>" +
            "</div>" +
            "<div class='artist-area'>" +
                "<span class='artist-text'>" + escapeHtml(displayArtist) + "</span>" +
            "</div>" +
            "<button class='square-btn sort-handle'>" +
                "<svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'>" +
                    "<line x1='12' y1='2' x2='12' y2='22'></line>" +
                    "<polyline points='7 7 12 2 17 7'></polyline>" +
                    "<polyline points='7 17 12 22 17 17'></polyline>" +
                "</svg>" +
            "</button>";

        const playBtn = row.querySelector(".play-btn");
        playBtn.addEventListener("click",function(){
            playTrack(trackId);
        });

        const titleArea = row.querySelector(".title-area");
        const artistArea = row.querySelector(".artist-area");
        titleArea.addEventListener("click",function(){ triggerMarquee(titleArea); });
        artistArea.addEventListener("click",function(){ triggerMarquee(artistArea); });

        const sortHandle = row.querySelector(".sort-handle");
        bindDragAndDropEvents(row,sortHandle);

        menuListEl.appendChild(row);

    });

}

/*
HTMLとして表示する文字に、曲名由来の記号(<や>など)が
含まれていても崩れないようにする、簡易的なエスケープ関数です。
*/
function escapeHtml(text){
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

// 長いタイトル/アーティスト名をタップした時、横スクロールで見せます。
function triggerMarquee(areaElement){

    const textElement = areaElement.firstElementChild;
    textElement.classList.remove("scroll-active");
    void textElement.offsetWidth;

    const areaWidth = areaElement.offsetWidth;
    const textWidth = textElement.scrollWidth;
    const speed = 50;

    let scrollDistance = textWidth > areaWidth ? textWidth - areaWidth + 20 : textWidth * 0.6;
    const duration = (scrollDistance + areaWidth) / speed;

    textElement.style.setProperty("--scroll-x","-" + scrollDistance + "px");
    textElement.style.setProperty("--scroll-duration",duration + "s");
    textElement.classList.add("scroll-active");

    textElement.addEventListener("animationend",function(){
        textElement.classList.remove("scroll-active");
    },{once:true});

}


// ==========================================================
// 4. 曲の再生
// ==========================================================
/**
 * 指定したtrack_idの曲を再生します。
 *
 * track.file_handle は c013のスキャン時にMusicフォルダから
 * 取得したFileSystemFileHandleです。
 *
 * c013の権限バグと同じ理由(ページ遷移でJSの実行コンテキストが
 * リセットされるため)で、ここでも必ず権限を確認し直してから
 * ファイルを読み込みます。
 */
async function playTrack(trackId){

    try{

        const track = libraryMap[trackId];

        if(!track || !track.file_handle){
            alert("曲データが見つかりませんでした。c013で再登録してください。");
            return;
        }

        // --- 権限を確認し直します(c013と同じパターン) ---
        let permission = await track.file_handle.queryPermission({mode:"read"});

        if(permission !== "granted"){
            permission = await track.file_handle.requestPermission({mode:"read"});
        }

        if(permission !== "granted"){
            alert("この曲へのアクセスが許可されませんでした。");
            return;
        }

        const file = await track.file_handle.getFile();

        if(currentObjectUrl){
            URL.revokeObjectURL(currentObjectUrl);
        }

        currentObjectUrl = URL.createObjectURL(file);

        audioPlayer.src = currentObjectUrl;
        nowPlayingEl.textContent = "再生中：" + (track.title || track.file_name);
        playerBox.style.display = "block";

        /*
        ここから下は、権限やファイル取得ではなく
        「実際に音として再生できるか」の問題です。

        権限が原因の失敗と、コーデック非対応など
        別の原因の失敗を混同しないよう、
        try/catchを分けています。
        */
        try{

            await audioPlayer.play();

            console.log("再生開始 :",track.file_name);

        }
        catch(playError){

            console.error(
                "再生失敗(play) :",
                playError.name,
                playError.message
            );

            alert(
                "この曲は再生できませんでした。\n" +
                "ファイル形式(コーデック)がこの端末で対応していない可能性があります。\n" +
                "(" + track.file_name + ")"
            );

        }

    }
    catch(error){
        console.error(
            "再生失敗(権限/ファイル取得) :",
            error.name,
            error.message
        );
        alert("再生に失敗しました。ブラウザのファイル権限が切れている可能性があります。");
    }

}

/*
============================================================
audio要素自体がエラーを起こした時の処理

play()の時点ではエラーにならなくても、
実際にファイルを読み込んで再生しようとした段階で
コーデック非対応と分かることがあります。

その場合はこちらのonerrorイベントで検知します。
============================================================
*/
audioPlayer.onerror = function(){

    if(!audioPlayer.error){ return; }

    console.error(
        "audio要素エラー :",
        audioPlayer.error.code,
        audioPlayer.error.message
    );

    let reason = "不明なエラーです。";

    if(audioPlayer.error.code === audioPlayer.error.MEDIA_ERR_DECODE){
        reason = "ファイル形式(コーデック)がこの端末で対応していない可能性があります。";
    }
    else if(audioPlayer.error.code === audioPlayer.error.MEDIA_ERR_SRC_NOT_SUPPORTED){
        reason = "この形式のファイルは、このブラウザでは再生できません。";
    }

    alert("再生できませんでした。\n" + reason);

};


// ==========================================================
// 5. 並び替え(OFS: On-Demand Floating Sort を移植)
// ==========================================================
/*
以下は legacy/ver8.5-gemini の OFSモジュールを移植したものです。
処理の考え方は元のOFS仕様書の通りで、変えていません。

・並び替えボタン(.sort-handle)を掴んだ時だけ反応する
  (曲名エリアでの通常スクロールを邪魔しないため)
・指を離した時だけ、並び順をplaylistsストアへ保存する
  (ドラッグ中に毎回保存すると重くなるため)
*/

function bindDragAndDropEvents(row,handle){

    handle.addEventListener("pointerdown",function(e){

        e.preventDefault();
        draggingRow = row;
        currentClientY = e.clientY;

        const rect = row.getBoundingClientRect();
        startOffsetY = e.clientY - rect.top;

        if(!placeholder){
            placeholder = document.createElement("div");
            placeholder.className = "drag-placeholder";
        }

        row.parentNode.insertBefore(placeholder,row);

        row.style.width = rect.width + "px";
        row.style.height = rect.height + "px";
        row.style.left = rect.left + "px";
        row.style.top = rect.top + "px";
        row.classList.add("dragging");
        handle.classList.add("active-blue");

        handle.setPointerCapture(e.pointerId);

        if(navigator.vibrate){ navigator.vibrate(15); }

        // 掴んだ瞬間は自動スクロールを起動しません(端をうっかり掴んだ時の暴走防止)。

    });

    handle.addEventListener("pointermove",function(e){

        if(!draggingRow){ return; }
        e.preventDefault();

        currentClientY = e.clientY;

        draggingRow.style.top = (currentClientY - startOffsetY) + "px";

        updatePlaceholderPosition(currentClientY);

        // 指が動くたびにセンサーを起動します(端に入った時だけループが着火します)。
        startAutoScrollLoop();

    });

    handle.addEventListener("pointerup",function(e){

        if(!draggingRow){ return; }
        handle.releasePointerCapture(e.pointerId);
        clearAllDraggingStates();

    });

}

function updatePlaceholderPosition(clientY){

    if(!draggingRow || !placeholder){ return; }

    const siblings = Array.prototype.slice.call(
        menuListEl.querySelectorAll(".music-row:not(.dragging)")
    );

    const nextSibling = siblings.find(function(sibling){
        const box = sibling.getBoundingClientRect();
        return clientY <= box.top + box.height / 2;
    });

    if(nextSibling){
        menuListEl.insertBefore(placeholder,nextSibling);
    }
    else{
        menuListEl.appendChild(placeholder);
    }

}

/*
オンデマンド(指の動きに応じて)再着火する自動スクロールループです。

一度ゾーンから出るとループを終了させ、
次にゾーンへ入った時にまた新しく起動し直します。
(こうしないと「一度止まると二度と動かない」バグになります)
*/
function startAutoScrollLoop(){

    if(autoScrollActive){ return; }

    const threshold = 100;
    const windowHeight = window.innerHeight;

    const isTopZone = (currentClientY < threshold && window.scrollY > 0);
    const isBottomZone = (currentClientY > windowHeight - threshold);

    if(!isTopZone && !isBottomZone){ return; }

    autoScrollActive = true;

    function scrollLoop(){

        if(!draggingRow){ stopAutoScrollGlow(); return; }

        let speed = 0;
        const glowTop = document.getElementById("glow-top");
        const glowBottom = document.getElementById("glow-bottom");

        glowTop.classList.remove("glow-active");
        glowBottom.classList.remove("glow-active");

        if(currentClientY < threshold && window.scrollY > 0){
            const ratio = (threshold - currentClientY) / threshold;
            speed = -Math.ceil(ratio * 25);
            glowTop.classList.add("glow-active");
        }
        else if(currentClientY > windowHeight - threshold){
            const currentScrollMax = document.documentElement.scrollHeight - windowHeight;
            if(window.scrollY < currentScrollMax){
                const ratio = (currentClientY - (windowHeight - threshold)) / threshold;
                speed = Math.ceil(ratio * 25);
                glowBottom.classList.add("glow-active");
            }
        }

        if(speed !== 0){
            window.scrollBy(0,speed);
            updatePlaceholderPosition(currentClientY);
            requestAnimationFrame(scrollLoop);
        }
        else{
            autoScrollActive = false;
            stopAutoScrollGlow();
        }

    }

    requestAnimationFrame(scrollLoop);

}

function stopAutoScrollGlow(){
    document.getElementById("glow-top").classList.remove("glow-active");
    document.getElementById("glow-bottom").classList.remove("glow-active");
}

function clearAllDraggingStates(){

    let needSave = false;

    if(draggingRow && placeholder && placeholder.parentNode){
        placeholder.parentNode.insertBefore(draggingRow,placeholder);
        needSave = true;
    }

    if(placeholder && placeholder.parentNode){
        placeholder.parentNode.removeChild(placeholder);
    }

    menuListEl.querySelectorAll(".music-row").forEach(function(row){
        row.classList.remove("dragging");
        row.style.position = "";
        row.style.width = "";
        row.style.height = "";
        row.style.left = "";
        row.style.top = "";
    });

    menuListEl.querySelectorAll(".sort-handle").forEach(function(h){
        h.classList.remove("active-blue");
    });

    draggingRow = null;
    autoScrollActive = false;
    stopAutoScrollGlow();

    if(needSave){
        saveNewOrderFromDOM();
    }

}

/*
指を離した時、実際のDOMの並び順を読み取って
playlistsストアへ保存します。

現行スキーマ(docs/db-schema.md)に合わせ、
track_id_list という配列名で保存します。
(OFSの元の実装はfile_path_listでしたが、
 track_idを主キーとする現行スキーマに合わせて変更しています)
*/
async function saveNewOrderFromDOM(){

    const rows = Array.prototype.slice.call(
        menuListEl.querySelectorAll(".music-row")
    );

    currentOrderList = rows.map(function(row){
        return row.dataset.trackId;
    });

    const playlistData = {
        playlist_id: MAIN_MENU_PLAYLIST_ID,
        playlist_name: "メイン全曲リスト",
        track_id_list: currentOrderList,
        norirun_track_id_list: []
    };

    await idbPut(STORE_PLAYLISTS,playlistData);

    console.log("並び順を保存しました :",currentOrderList.length,"曲");

}

window.addEventListener("pointerup",clearAllDraggingStates);
window.addEventListener("pointercancel",clearAllDraggingStates);


// ==========================================================
// 6. 画面起動
// ==========================================================

loadMenuData();

</script>
